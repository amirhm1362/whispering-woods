        pos.push(c.x, y, z); uv.push(i / cols, v);
      }
    }
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) { const a = i * (rows + 1) + j, b = a + rows + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
    mesh(g, capM);
  }
  // the name again on a small cloth across the croup, facing back toward the camera that follows
  { const pl = new T.Mesh(new T.PlaneGeometry(.62, .2), new T.MeshStandardMaterial({ map: nameTex(T, color, name), roughness: .85, side: T.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 }));
    pl.position.set(-.8, 1.71, 0); pl.lookAt(-.8 - .62, 1.71 + .78, 0); body.add(pl); }
  const saddle = mesh(loftGeo(T, [[-.32, 1.68], [-.25, 1.64], [.05, 1.62], [.22, 1.66], [.28, 1.72]], [[.06, .2], [.05, .22], [.04, .23], [.05, .2], [.06, .1]], { seg: 16, ring: 16 }), leatherM);
  { const rein = new T.Mesh(new T.TorusGeometry(.62, .012, 6, 40, 1.15), leatherM); rein.position.set(1.0, 1.55, 0); rein.rotation.set(Math.PI / 2, 0, 1.75); body.add(rein); }

  // ---- the knight ----
  const knight = new T.Group(); knight.position.set(.02, 1.62, 0); body.add(knight);
  const km = (g, m) => mesh(g, m, knight);
  km(loftGeo(T, [[-.02, 0, 0], [0, .2, 0], [.03, .45, 0], [.03, .62, 0], [.02, .7, 0]], [[.17, .21], [.17, .21], [.19, .26], [.13, .2], [.06, .07]], { seg: 24, ring: 18 }), steelM);
  // tabard in the player's colour over the armour, a gold belt, split skirts over the saddle
  km(loftGeo(T, [[-.02, .02, 0], [0, .2, 0], [.03, .46, 0], [.03, .58, 0]], [[.185, .225], [.183, .222], [.2, .27], [.15, .22]], { seg: 16, ring: 18 }), clothM);
  { const belt = km(new T.TorusGeometry(.2, .022, 8, 32), goldM); belt.rotation.x = Math.PI / 2; belt.position.set(0, .16, 0); belt.scale.set(.95, 1.12, 1); }
  [-1, 1].forEach(s => { const sk = km(new T.PlaneGeometry(.34, .34), clothM); sk.position.set(.04, -.12, s * .2); sk.rotation.set(s * -.25, 0, 0); });
  // helm, visor slit, plume
  const helm = km(loftGeo(T, [[.02, .66, 0], [.02, .74, 0], [.02, .92, 0], [.02, .98, 0], [.02, 1.0, 0]], [[.12, .115], [.135, .125], [.13, .125], [.09, .085], [.01, .01]], { seg: 16, ring: 20, pow: 2.6 }), steelM);
  const slit = km(new T.BoxGeometry(.03, .028, .2), darkSteelM); slit.position.set(.145, .855, 0);
  const crest = km(loftGeo(T, [[.02, .98, 0], [-.04, 1.12, 0], [-.18, 1.2, 0], [-.34, 1.14, 0], [-.44, .98, 0]], [[.05, .04], [.08, .05], [.09, .05], [.07, .04], [.01, .01]], { seg: 20, ring: 12 }), new T.MeshStandardMaterial({ color, roughness: .9 }));
  // pauldrons, arms holding the reins, legs in the stirrups

/* ---------- identity helpers ---------- */
function me() { return APP.mode === 'local' ? (APP.S && APP.S.t ? ENG.cur(APP.S).id : null) : (APP.seat || APP.device); }
function isMe(pid) { return APP.mode === 'online' && pid === me(); }
function privateFor(pid) { return APP.mode === 'local' || pid === me(); }
function nm(pid) { const p = APP.S && ENG.player(APP.S, pid); return p ? p.name : 'Someone'; }
function who(pid) { return isMe(pid) ? 'You' : nm(pid); }
function whom(pid) { return isMe(pid) ? 'you' : nm(pid); }
function whose(pid) { return isMe(pid) ? 'your' : nm(pid) + '’s'; }
function myTurn() { const S = APP.S; if (!S || S.phase !== 'play') return false; return APP.mode === 'local' || ENG.cur(S).id === me(); }
function amPlayer() { const p = APP.S && ENG.player(APP.S, me()); return !!(p && !p.left); }
function onlineSet() { return APP.net ? APP.net.onlineSeats() : new Set(); }
function posMap(S) { const m = {}; (S.players || []).forEach(p => { if (p.pos != null) m[p.id] = p.pos; }); return m; }
function getName() { const el = $('#nameIn'); const v = (el ? el.value : LS.get('ww.name', '')).trim().slice(0, 16); if (v) LS.set('ww.name', v); return v; }
function labels(S) {
  const L = {}, ps = (S && S.players) || [];
  const first = (n) => (String(n || '?').trim()[0] || '?').toUpperCase();
  const two = (n) => { const s = String(n || '?').trim(); return (s[0] || '?').toUpperCase() + (s[1] || '').toLowerCase(); };
  ps.forEach((p) => { const f = first(p.name); L[p.id] = ps.some(q => q !== p && first(q.name) === f) ? two(p.name) : f; });
  const dup = new Set(ps.filter(p => ps.some(q => q !== p && L[q.id] === L[p.id])).map(p => p.id));
  ps.forEach((p, i) => { if (dup.has(p.id)) { const num = String(p.name || '').match(/(\d+)\s*$/); L[p.id] = first(p.name) + (num ? num[1] : i + 1); } });
  return L;
}

/* ---------- sound (tiny synth, no files) ---------- */
const SFX = (() => {
  let ctx = null;
  const c = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(f, d = .15, type = 'sine', v = .1, delay = 0, slide = 0) {
    if (!APP.sound) return; const a = c(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
  }
  function click(delay, v = .09) {
    if (!APP.sound) return; const a = c(); if (!a) return;
    const b = a.createBuffer(1, a.sampleRate * .03, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 1200; g.gain.value = v;
    s.buffer = b; s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime + delay);
  }
  return {
    unlock: c,
    roll() { for (let i = 0; i < 7; i++) click(i * .065 + Math.random() * .02); },
    step() { tone(560, .06, 'triangle', .05); },
    peek() { tone(660, .18, 'sine', .09); tone(990, .28, 'sine', .07, .12); },
    good() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .24, 'triangle', .1, i * .1)); },
    bad() { tone(330, .25, 'sawtooth', .05, 0, 220); tone(247, .35, 'sawtooth', .05, .18, 150); },
    bump() { tone(150, .22, 'square', .06, 0, 70); },
    magic() { [880, 1175, 1568, 2093].forEach((f, i) => tone(f, .16, 'sine', .05, i * .06)); },
    turn() { tone(784, .2, 'sine', .09); tone(1175, .32, 'sine', .07, .15); },
    tap() { tone(720, .04, 'triangle', .04); },
    msg() { tone(880, .07, 'sine', .06); tone(1320, .1, 'sine', .05, .07); },
  };
})();

function confetti() {
  if (REDUCED) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  const cols = ['#ebb63c', '#d8383a', '#2f6fd8', '#8f4fc6', '#3cc46a', '#fff3b0'];
  const P = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .6, vx: (Math.random() - .5) * 4 * dpr, vy: (2 + Math.random() * 4) * dpr, r: (5 + Math.random() * 6) * dpr, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();

/* ---------- event text ---------- */
function evText(e) {
  const n = who(e.p);
  switch (e.k) {
    case 'start': return `The hunt begins! The King seeks ${tref(e.wish)}.`;
    case 'turn': return `${isMe(e.p) ? 'Your' : nm(e.p) + '’s'} turn.`;
    case 'roll': return `${n} rolled ${e.d[0]} and ${e.d[1]}${e.d[0] === e.d[1] ? ' — doubles!' : '.'}`;
    case 'move': return e.via === 'fly' ? `${n} flew by magic.` : `${n} moved ${e.path.length - 1} space${e.path.length === 2 ? '' : 's'}.`;
    case 'bump': return `${n} sent ${whom(e.o)} back to the village!`;
    case 'peek': return `${n} peeked under a pine.`;
    case 'castle': return `${n} ${e.stay ? 'stayed' : 'arrived'} at the castle gate.`;
    case 'guess': return e.ok ? `${n} found ${tref(e.want)}!` : `${n} lifted the wrong pine — back to the village.`;
    case 'wishnew': return `The King now seeks ${tref(e.wish)}.`;
    case 'magic': return e.m === 'wish' ? `${n} changed the King’s wish${e.same ? ' — but it came up the same' : ''}.` : e.m === 'fly' ? `${n} cast Fly to a pine.` : `${n} took the castle road by magic.`;
    case 'stuck': return `${n} had nowhere to move.`;
    case 'skip': return `${who(e.by)} skipped ${whose(e.p)} turn.`;
    case 'left': return `${n} left the game.`;
    case 'win': return `${n} won the crown!`;
  }
  return '';
}

/* ============================================================
   ONLINE: create / join / lobby
   ============================================================ */
function leaveNet() {
  clearInterval(APP.joinTimer); clearTimeout(APP.findTimer); APP.joinWant = null; APP.notFound = false;
  if (APP.net) { try { APP.net.close(); } catch (e) {} APP.net = null; }
}
function connectNet(room) {
  leaveNet();
  APP.mode = 'online'; APP.room = room; APP.seenN = -1;
  APP.seat = LS.get('ww.seat.' + room) || APP.device;
  APP.net = new NetRoom({ room, device: APP.device, seat: APP.seat, brokers: BROKERS });
  APP.net.on('state', onRemote);
  APP.net.on('join', onJoinMsg);
  APP.net.on('presence', onPresence);
  APP.net.on('chat', onChat);
  APP.chat = new Map(); APP.myChat = []; APP.unread = 0; APP.chatSince = Date.now(); renderChatBtn();
  APP.net.on('status', () => { renderConn(); if (APP.screen === 'lobby') renderLobby(); });
  APP.net.start();
  setUrlRoom(room);
}
function createOnline() {
  const name = getName();
  if (!name) { toast('Type your name first.'); $('#nameIn') && $('#nameIn').focus(); return; }
  const room = roomCode();
  connectNet(room);
  const s = ENG.newLobby(room, { id: me(), name, color: 0 });
  s.v = 1; s.w = me();
  APP.S = s; APP.seenN = 0;
  APP.net.publishState(s);
  enterLobby();
  APP.findTimer = setTimeout(() => { if (APP.screen === 'lobby') renderLobby(); }, 8000);
}
function joinFlow(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  if (code.length < 4) { toast('That code looks too short.'); return; }
  connectNet(code); APP.S = null;
  renderJoin();
  APP.findTimer = setTimeout(() => { if (!APP.S) { APP.notFound = true; renderJoin(); } }, 10000);
}
function onRemote(ns) {
  const S = APP.S;
  if (S && ns.v === S.v && ns.w === S.w) return;
  const newer = !S || ns.v > S.v || (ns.v === S.v && ns.w > S.w);
  if (newer) { APP.S = ns; absorb(ns); return; }
  if (S && S.w === me() && Date.now() - APP.healAt > 2000) { APP.healAt = Date.now(); APP.net.publishState(S); }
}
function onJoinMsg(m) {
  const S = APP.S;
  if (!S || S.phase !== 'lobby' || S.host !== me() || m.pid === me()) return;
  if (m.leave) { if (ENG.player(S, m.pid)) doAct({ a: 'kick', pid: m.pid }); return; }
  const name = String(m.name || 'Player').slice(0, 16), ex = ENG.player(S, m.pid);
  const takenByOther = S.players.some(p => p.id !== m.pid && p.color === m.color);
  if (ex && ex.name === name && (m.color == null || ex.color === m.color || takenByOther)) return;
  if (!ex && S.players.length >= 6) return;
  doAct({ a: 'join', pid: m.pid, name, color: m.color });
}
function onPresence() {
  const S = APP.S; if (!S) return;
  const on = onlineSet(), now = Date.now();
  S.players.forEach(p => { if (on.has(p.id)) delete APP.offSince[p.id]; else if (!APP.offSince[p.id]) APP.offSince[p.id] = now; });
  if (APP.screen === 'lobby') renderLobby();
  else if (APP.screen === 'join') renderJoin();
  else if (APP.screen === 'game') { renderPlayers(); if (!APP.busy) renderDock(); }
}
/* ---------- chat ---------- */
const QUICK = ['Hello!', 'Good luck!', 'Your turn!', 'Nice move!', 'Oops!', 'Ha ha!', 'Well played!', 'Be right back'];
function chatName() { const p = APP.S && ENG.player(APP.S, me()); return p ? p.name : (LS.get('ww.name', '') || 'Guest'); }
function chatColor() { const p = APP.S && ENG.player(APP.S, me()); return p ? p.color : -1; }
function onChat(dev, list) {
  let fresh = 0;
  for (const m of list.slice(-40)) {
    if (!m || typeof m.id !== 'string' || typeof m.x !== 'string' || APP.chat.has(m.id)) continue;
    const msg = { id: m.id.slice(0, 16), p: String(m.p || ''), n: String(m.n || 'Someone').slice(0, 16), c: Number.isInteger(m.c) ? m.c : -1, x: m.x.slice(0, 200), t: +m.t || 0, d: dev };
    APP.chat.set(msg.id, msg);
    if (dev === APP.device) { if (!APP.myChat.some(q => q.id === msg.id)) APP.myChat.push(m); continue; }
    if (msg.t >= APP.chatSince - 4000) { fresh++; if (!APP.chatOpen) { APP.unread++; if (APP.screen === 'game' || APP.screen === 'lobby') toast(`${msg.n}: ${msg.x.length > 70 ? msg.x.slice(0, 70) + '…' : msg.x}`); } }
  }
  if (APP.chat.size > 120) { const keep = [...APP.chat.values()].sort((a, b) => a.t - b.t).slice(-100); APP.chat = new Map(keep.map(m => [m.id, m])); }
  APP.myChat.sort((a, b) => a.t - b.t);
  if (fresh) SFX.msg();
  renderChatBtn();
  if (APP.chatOpen) renderChatList(true);
}
function sendChat(text) {
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 200);
  if (!text || !APP.net) return false;
  if (Date.now() - APP.lastSend < 700) return false;
  APP.lastSend = Date.now();
  const m = { id: rid(10), p: me(), n: chatName(), c: chatColor(), x: text, t: Date.now() };
  APP.myChat.push(m); APP.myChat = APP.myChat.slice(-25);
  APP.chat.set(m.id, { ...m, d: APP.device });
  APP.net.publishChat(APP.myChat);
  SFX.tap(); renderChatList(true);
  return true;
}
function renderChatBtn() {
  const b = $('#chatBtn'), badge = $('#chatBadge'); if (!b) return;
  b.hidden = APP.mode !== 'online';
  badge.hidden = !APP.unread; badge.textContent = APP.unread > 9 ? '9+' : String(APP.unread);
  b.setAttribute('aria-label', APP.unread ? `Chat, ${APP.unread} new` : 'Chat');
  const lb = $('#lobbyChat'); if (lb) lb.textContent = APP.unread ? `Chat (${APP.unread} new)` : 'Chat with players';
}
function chatItems() {
  const msgs = [...APP.chat.values()].sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1));
  if (!msgs.length) return '<div class="empty">No messages yet. Say hello!</div>';

function doAct(a) {

  const by = APP.mode === 'local' ? (S.phase === 'over' ? S.players[0].id : (S.t ? ENG.cur(S).id : S.host)) : me();
  let ns;
  try { ns = ENG.apply(S, a, by); } catch (err) { console.warn('rejected', a, err.message); return false; }
  ns.v = (S.v || 0) + 1; ns.w = by;
  APP.sel = { die: null, magic: null, tree: null };
  APP.S = ns;

}
function absorb(S) {
  if (APP.seenN < 0) APP.seenN = S.n;
  if (S.phase === 'lobby') {
    APP.seenN = S.n;
    if (ENG.player(S, me())) { if (APP.screen !== 'lobby') enterLobby(); else renderLobby(); }
    else { if (APP.screen === 'lobby') toast('You were removed from the lobby.'); renderJoin(); }
    return;
  }
  if (APP.screen !== 'game') {
    const mine = ENG.player(S, me());
    if (APP.mode === 'local' || APP.watching || mine) enterGame();
    else { APP.seenN = S.n; renderJoin(); return; }
  }
  let evs = S.log.filter(e => e.n > APP.seenN);
  APP.seenN = Math.max(APP.seenN, S.n);
  if (evs.length > 10) { APP.disp = posMap(S); evs = evs.slice(-3).filter(e => e.k !== 'move'); }
  if (!evs.length) { if (!APP.busy) renderGame(); return; }
  queueEvents(evs, S);
}
let chain = Promise.resolve();
function queueEvents(evs, S) {
  APP.busy = true; renderDock(); renderHL();
  chain = chain.then(async () => {
    APP.busy = true;
    for (const e of evs) { try { await playEvent(e, S); } catch (x) { console.error(x); } }
  }).then(() => {
    APP.busy = false; APP.hop = null; APP.disp = posMap(APP.S);

}
async function playEvent(e, S) {

      toast(`The hunt begins! The King seeks ${tref(e.wish)}.`); await sleep(700); break;
    case 'turn':
      CAM.manual = false; CAM.key = '';
      renderPlayers();
      if (isMe(e.p)) { SFX.turn(); try { navigator.vibrate && navigator.vibrate([70, 50, 70]); } catch (x) {} toast('Your turn!'); if (document.hidden) document.title = '★ Your turn — Whispering Woods'; }
      else if (APP.mode === 'local' && S.players.length > 1) toast(`${nm(e.p)}’s turn — pass the phone.`);
      break;
    case 'roll':
      if (isMe(e.p) || APP.mode === 'local') CAM.manual = false;
      renderDock(); updateDice(true); SFX.roll(); await sleep(1050); break;
    case 'move': {
      const end = e.path[e.path.length - 1];
      if (V3.on) { await v3Walk(e); APP.disp[e.p] = end; APP.hop = null; renderPieces(); break; }
      camTo(bbox(e.path.map(id => BOARD.nodes[id]))); await sleep(VIEW.auto && !CAM.manual ? 380 : 0);
      if (e.via === 'fly') {
        sparkleAt(BOARD.nodes[e.path[0]]); SFX.magic(); await sleep(250);
        APP.disp[e.p] = end; APP.hop = e.p; renderPieces(); sparkleAt(BOARD.nodes[end]); await sleep(450);
      } else {
        for (let i = 1; i < e.path.length; i++) { APP.disp[e.p] = e.path[i]; APP.hop = e.p; renderPieces(); trailAt(BOARD.nodes[e.path[i - 1]]); SFX.step(); await sleep(175); }
      }
      APP.hop = null; break;
    }
    case 'bump':

      APP.disp[e.o] = BOARD.STAR; sparkleAt(BOARD.nodes[BOARD.STAR]); renderPieces(); SFX.bump();
      toast(`${who(e.p)} sent ${whom(e.o)} back to the village!`); await sleep(550); break;
    case 'peek': {
      const mine = privateFor(e.p);
      if (V3.on) {
        SFX.peek();
        if (!mine) toast(`${nm(e.p)} peeked under a pine — watch closely!`);
        await v3Peek(e, mine && APP.mode === 'online' ? S.layout[e.tree] : null);

      APP.lift[e.tree] = { at: Date.now(), face: mine ? S.layout[e.tree] : null }; renderPieces(); SFX.peek();
      if (mine) { remember(S, e.tree); showPeek(S, e); } else toast(`${nm(e.p)} peeked under a pine — watch closely!`);
      await sleep(1400); delete APP.lift[e.tree]; renderPieces(); break;
    }
    case 'castle':
      sparkleAt(BOARD.nodes[BOARD.KEY]);
      if (!privateFor(e.p) || APP.mode === 'local') toast(`${who(e.p)} ${e.stay ? 'stays' : 'arrived'} at the castle gate!`);
      await sleep(300); break;
    case 'guess': await showGuess(e, S); break;
    case 'wishnew': flipWish(e.wish); toast(`The King now seeks ${tref(e.wish)}.`); await sleep(600); break;
    case 'magic':
      SFX.magic();
      if (e.m === 'wish') { flipWish(e.wish); toast(e.same ? `${who(e.p)} cast a spell — but the King still wants ${tref(e.wish)}.` : `${who(e.p)} cast a spell — the King now seeks ${tref(e.wish)}!`); await sleep(800); }
      else toast(e.m === 'fly' ? `${who(e.p)} cast Fly to a pine!` : `${who(e.p)} took the castle road by magic!`);
      break;
    case 'stuck': toast(`${who(e.p)} had nowhere to move.`); break;
    case 'skip': toast(`${who(e.by)} skipped ${whose(e.p)} turn.`); break;
    case 'left': toast(`${nm(e.p)} left the game.`); renderPlayers(); break;
    case 'win': await showWin(e, S); break;
  }
}

}

function spellsHTML(S, p) {

function renderDock() {
  const S = APP.S; if (!S || S.phase === 'lobby' || APP.screen !== 'game') return;
  const put = (id, h) => { const el = $('#' + id); if (el.innerHTML !== h) el.innerHTML = h; };
  updateDice(false);
  put('dTick', esc(lastLine(S)));
  if (S.phase === 'over') {
    const w = ENG.player(S, S.winner);
    put('dWho', w ? pawnMini(w) + `<span>${isMe(w.id) ? 'You' : esc(w.name)} won the crown!</span>` : 'Game over');
    put('dHint', '');
    put('dActs', `${APP.mode === 'local' || amPlayer() ? '<button class="btn" data-act="again">Play again</button>' : ''}<button class="btn parch" data-act="${APP.mode === 'local' ? 'homeLocalDone' : 'home'}">Home</button>`);
    return;
  }
  const p = ENG.cur(S), t = S.t, mine = myTurn();
  const label = mine ? (APP.mode === 'local' ? `${esc(p.name)}’s turn` : 'Your turn') : `${esc(p.name)}’s turn`;
  let hint = '', acts = '';
  if (!mine) {
    const doing = { start: 'is about to roll.', rolled: 'rolled doubles and is choosing a spell…', move: 'is on the move.', guess: 'is at the castle gate, choosing a pine…' }[t.step] || '';
    hint = `${esc(p.name)} ${doing}`;
    if (APP.mode === 'online' && !onlineSet().has(p.id)) {
      const since = APP.offSince[p.id] || (APP.offSince[p.id] = Date.now());
      hint += ` <b>They seem to be offline.</b>`;
      if (amPlayer() && Date.now() - since > 12000) acts = `<button class="btn ruby" data-act="skip">Skip ${esc(p.name)}’s turn</button>`;
    }
    if (!amPlayer()) hint += ' <span class="tiny">(You’re watching.)</span>';
  } else switch (t.step) {
    case 'start':
      if (p.pos === BOARD.KEY) { hint = 'You’re at the castle gate. Answer the King’s new wish now, or roll to search more pines.'; acts = `<button class="btn" data-act="answer">Answer the King</button><button class="btn parch" data-act="roll">Roll instead</button>`; }
      else { hint = APP.mode === 'local' && S.players.length > 1 ? 'Hand the phone to ' + esc(p.name) + ', then roll.' : 'Roll both dice — each die is its own move.'; acts = `<button class="btn wide" data-act="roll">Roll the dice</button>`; }
      break;
    case 'rolled':
      if (APP.sel.magic === 'fly') { hint = 'Tap any glowing blue gem to fly there and peek.'; acts = `<button class="btn parch" data-act="spellBack">Back to spells</button>`; }
      else { hint = '<b>Doubles!</b> Cast one spell instead of moving:'; acts = spellsHTML(S, p); }
      break;
    case 'move': {
      const di = selDie(), both = t.rem.length === 2 && t.dice[0] !== t.dice[1];
      hint = di == null ? 'No moves left.' : `Move <b>${t.dice[di]}</b>: tap a glowing space.${both ? ' Tap the other die to move that one first.' : t.rem.length === 2 ? ' Then move the other die.' : ' Last die!'}`;
      break;
    }
    case 'guess': {
      const w = ENG.wish(S);
      if (APP.sel.tree == null) hint = `Which pine hides <b>${esc(tref(w))}</b>? Tap it on the board.`;
      else { hint = `Lift this pine to show the King?`; acts = `<button class="btn" data-act="lift">Lift this pine</button><button class="btn parch" data-act="unpick">Choose another</button>`; }
      break;
    }
  }
  put('dWho', `${pawnMini(p)}<span>${label}</span>`);
  put('dHint', hint);
  put('dActs', acts);
  $$('#dActs button').forEach(b => { b.disabled = APP.busy; });
}

function rulesHTML() {

  <p>The old King will hand his crown to whoever brings him news of his lost treasures. Each of the 13 pines in the woods hides one treasure token underneath. Remember what you find — and be first to tell the King where his wish is hidden.</p>

  <h3>On your turn</h3>
  <ol><li>Roll both dice.</li><li>Move one die’s full number, then the other’s. Each die is its own move: walk in one direction for that die (no turning back halfway), but you may change direction for the second die. Use both together to go further.</li><li>You can pass other movers, and the space still counts.</li></ol>
  <h3>Peeking</h3><p>Whenever a die move ends on a <b>blue space</b>, you secretly look under the pine beside it. Everyone sees <i>which</i> pine you lifted, but only you see the treasure. Watch where others peek!</p>
  <h3>Sending players home</h3><p>End a die move on another mover’s space and they go back to the start circle in the village.</p>

  <ol><li><b>Right:</b> everyone sees the treasure, you keep the card, and the next card is turned up. Next turn you may stay at the gate and answer the new wish, or roll and search.</li><li><b>Wrong:</b> you see what was really there, and walk back to the start circle.</li></ol>

/* ---------- wiring ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.act]; if (!fn) return;
  e.preventDefault(); SFX.unlock(); fn(b.dataset.arg, b);
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  if (el.dataset.change === 'first') doAct({ a: 'settings', settings: { first: el.value } });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'codeIn') ACTIONS.joinCode();
  if (e.key === 'Enter' && e.target.id === 'chatIn') { e.preventDefault(); ACTIONS.sendChat(); }
  if (e.key === 'Escape' && APP.sheetOpen && !APP.pending) closeSheet();
});
$('#veil').addEventListener('click', (e) => { if (e.target.id === 'veil' && !APP.pending && !$('#sheet [data-act=leaveYes]')) closeSheet(); });
$('#menuBtn').addEventListener('click', () => ACTIONS.menu());
$('#board').addEventListener('click', (e) => {
  if (APP.dragged) { APP.dragged = false; return; }
  const S = APP.S; if (!S || S.phase !== 'play' || APP.busy || !myTurn()) return;
  const svg = $('#board'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  const T = targets();
  if (T.length) {
    let best = null, bd = 1e9;
    for (const id of T) { const n = BOARD.nodes[id], dd = Math.hypot(n.x - q.x, n.y - q.y); if (dd < bd) { bd = dd; best = id; } }
    if (bd < Math.max(85, CAM.cur.w * .11)) { if (S.t.step === 'move') doAct({ a: 'move', die: selDie(), to: best }); else doAct({ a: 'magic', k: 'fly', to: best }); }
    return;
  }
  if (S.t.step === 'guess') {
    let best = null, bd = 1e9;
    for (const t of BOARD.trees) { const dd = Math.hypot(t.x - q.x, t.y - 34 - q.y); if (dd < bd) { bd = dd; best = t.i; } }
    if (bd < 64) { APP.sel.tree = best; SFX.tap(); renderPieces(); renderHL(); renderDock(); }
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (APP.net) APP.net.kick(); if (APP.screen === 'game') requestWake(); document.title = 'Whispering Woods'; }
});
window.addEventListener('online', () => APP.net && APP.net.kick());
window.addEventListener('pageshow', (e) => { if (e.persisted && APP.net) APP.net.kick(); });
setInterval(() => {
  if (APP.screen !== 'game' || APP.mode !== 'online' || !APP.S || APP.S.phase !== 'play' || APP.busy) return;
  const p = ENG.cur(APP.S); if (!onlineSet().has(p.id)) renderDock();
}, 4000);

/* ---------- boot ---------- */
function boardArtMarkup() { return APP.boardURL ? `<image href="${APP.boardURL}" width="800" height="1160" preserveAspectRatio="none"/>` : `<use href="#boardVec"/>`; }
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i += 7) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + s.length.toString(36); }
async function paintBoard() {
  const body = boardStaticSVG(VIEW.simple);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2320" viewBox="0 0 ${BW} ${BH}"><defs>${artDefs()}</defs>${body}</svg>`;
  const key = 'ww.board.' + hashStr(svg);
  let url = LS.get(key);
  if (!url) {
    try {
      const src = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      const img = new Image(); img.src = src;
      await (img.decode ? img.decode() : new Promise((res, rej) => { img.onload = res; img.onerror = rej; }));
