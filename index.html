<title>Whispering Woods</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>

<style>
/* VOICE: a storybook board game in a gilded, carved-wood box — rich, warm, magical.
   IDEA: the phone is the game box: painted board in a gold frame, real pieces, a parchment tray.
   PICTURE: the illustrated forest board, lit and framed, fills the first screen.
   COLOUR and TYPE: walnut wood, parchment, burnished gold, royal crimson; Cinzel Decorative, Cinzel, Nunito.
   LAYOUT: one narrow column (max 520px): wood bar, medallion row, framed board, parchment tray. */
:root{--wood:#3b2414;--wood2:#1e1209;--parch:#f5e8c9;--parch2:#e6d09f;--ink:#2a1a0c;--ink2:#6b4e2a;--gold:#e9b43a;--gold2:#a8740c;--crimson:#8e1b2e;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25 0 0 0 0 .15 0 0 0 0 .05 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --c-tl:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g transform='rotate(0 20 20)' fill='none' stroke='%23a8740c' stroke-linecap='round'><path d='M3 37 V11 Q3 3 11 3 H37' stroke-width='1.6'/><path d='M8 32 V13 Q8 8 13 8 H32' stroke-width='.8'/><path d='M13 13 C17 10 22 12 21 17 C18 15 15 17 15 20 C12 18 11 15 13 13 Z' fill='%23c99a2e' stroke-width='.8'/><circle cx='26' cy='5.5' r='1.3' fill='%23a8740c' stroke='none'/><circle cx='5.5' cy='26' r='1.3' fill='%23a8740c' stroke='none'/></g></svg>");
  --c-tr:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g transform='rotate(90 20 20)' fill='none' stroke='%23a8740c' stroke-linecap='round'><path d='M3 37 V11 Q3 3 11 3 H37' stroke-width='1.6'/><path d='M8 32 V13 Q8 8 13 8 H32' stroke-width='.8'/><path d='M13 13 C17 10 22 12 21 17 C18 15 15 17 15 20 C12 18 11 15 13 13 Z' fill='%23c99a2e' stroke-width='.8'/><circle cx='26' cy='5.5' r='1.3' fill='%23a8740c' stroke='none'/><circle cx='5.5' cy='26' r='1.3' fill='%23a8740c' stroke='none'/></g></svg>");
  --c-br:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g transform='rotate(180 20 20)' fill='none' stroke='%23a8740c' stroke-linecap='round'><path d='M3 37 V11 Q3 3 11 3 H37' stroke-width='1.6'/><path d='M8 32 V13 Q8 8 13 8 H32' stroke-width='.8'/><path d='M13 13 C17 10 22 12 21 17 C18 15 15 17 15 20 C12 18 11 15 13 13 Z' fill='%23c99a2e' stroke-width='.8'/><circle cx='26' cy='5.5' r='1.3' fill='%23a8740c' stroke='none'/><circle cx='5.5' cy='26' r='1.3' fill='%23a8740c' stroke='none'/></g></svg>");
  --c-bl:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g transform='rotate(270 20 20)' fill='none' stroke='%23a8740c' stroke-linecap='round'><path d='M3 37 V11 Q3 3 11 3 H37' stroke-width='1.6'/><path d='M8 32 V13 Q8 8 13 8 H32' stroke-width='.8'/><path d='M13 13 C17 10 22 12 21 17 C18 15 15 17 15 20 C12 18 11 15 13 13 Z' fill='%23c99a2e' stroke-width='.8'/><circle cx='26' cy='5.5' r='1.3' fill='%23a8740c' stroke='none'/><circle cx='5.5' cy='26' r='1.3' fill='%23a8740c' stroke='none'/></g></svg>");
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;color:var(--parch);font:16px/1.45 Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip}
html{background:#100a05}
body{min-height:100vh;min-height:100dvh;background:var(--noise),radial-gradient(120% 60% at 50% 0%,#2a3d22 0%,#16200f 45%,#0d0905 100%) fixed}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;font-size:16px}
.col{width:100%;max-width:520px;margin:0 auto}
.scr{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
.scr.on{display:flex}
.goldtext{background:linear-gradient(180deg,#fff7d1 0%,#f6d266 32%,#d89b1c 50%,#b07610 54%,#f3c94e 78%,#fff0b0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a2104) drop-shadow(0 6px 14px rgba(0,0,0,.6))}

/* ---- buttons ---- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border:1px solid #6b4508;border-radius:14px;
  background:linear-gradient(180deg,#fff3bd 0%,#f7d461 16%,#e5ac2c 48%,#c98b12 52%,#eebf45 100%);color:#3a2104;font:800 16px/1.1 Cinzel,Georgia,serif;letter-spacing:.03em;text-shadow:0 1px 0 #fff1b8;
  box-shadow:inset 0 1px 0 #fffbe6,inset 0 -2px 0 #9a6a0c,0 3px 0 #4a2d05,0 10px 20px rgba(0,0,0,.5);transition:transform .08s,filter .2s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fffbe6,inset 0 -2px 0 #9a6a0c,0 1px 0 #4a2d05,0 5px 10px rgba(0,0,0,.5)}
.btn::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.btn:disabled{filter:grayscale(.75) brightness(.8);opacity:.6}.btn:disabled::after{display:none}
.btn.wide{width:100%}
.btn.parch{background:var(--noise),linear-gradient(180deg,#fffaf0,#ecdcb6);border-color:#8a6a3a;color:var(--ink);text-shadow:none;box-shadow:inset 0 1px 0 #fff,0 3px 0 #6b4e2a,0 8px 16px rgba(0,0,0,.4)}
.btn.parch::after,.btn.ghost::after,.btn.small::after{display:none}
.btn.ghost{background:rgba(20,12,5,.35);color:#f8e7bd;border:1.5px solid rgba(233,180,58,.6);box-shadow:inset 0 0 0 1px rgba(255,240,200,.08),0 6px 14px rgba(0,0,0,.35);text-shadow:0 1px 2px #000}
.btn.ruby{background:linear-gradient(180deg,#ff9aa6 0%,#d8384e 25%,#9c1a2e 55%,#c2304a 100%);border-color:#4a0812;color:#fff4f0;text-shadow:0 1px 0 #4a0812;box-shadow:inset 0 1px 0 #ffd0d6,0 3px 0 #3a0610,0 8px 18px rgba(0,0,0,.45)}
.btn.small{min-height:44px;padding:8px 14px;font-size:14px;border-radius:12px}
:focus-visible{outline:3px solid #9fd8ff;outline-offset:2px}
.link{background:none;border:0;color:#f3d27a;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(243,210,122,.5);font:700 15px Cinzel,Georgia,serif;padding:10px 6px;min-height:44px}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font:700 13px Cinzel,Georgia,serif;letter-spacing:.04em;color:var(--ink2)}
.field input{min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid #b8925a;background:#fffaf0;color:var(--ink);box-shadow:inset 0 2px 4px rgba(90,60,20,.18)}
.field input:focus{border-color:var(--gold2);outline:none;box-shadow:inset 0 2px 4px rgba(90,60,20,.18),0 0 0 3px rgba(233,180,58,.35)}
.muted{color:#d9c79e}.tiny{font-size:13px}

/* ---- parchment panels ---- */
.panel,.sheet{position:relative;color:var(--ink);border-radius:18px;padding:24px 20px 22px;
  background:var(--c-tl) top 6px left 6px/34px no-repeat,var(--c-tr) top 6px right 6px/34px no-repeat,var(--c-bl) bottom 6px left 6px/34px no-repeat,var(--c-br) bottom 6px right 6px/34px no-repeat,var(--noise),radial-gradient(130% 90% at 50% 30%,#fbf3de 0%,#f0dfb8 70%,#e2c78e 100%);
  border:1px solid #8a6328;box-shadow:inset 0 0 0 5px rgba(251,243,222,.9),inset 0 0 0 6px #c99a3c,inset 0 0 50px rgba(140,90,20,.28),0 16px 40px rgba(0,0,0,.6)}
.panel>*,.sheet>*{position:relative;z-index:1}
.panel h2,.sheet h2{margin:0 0 6px;font-size:27px;line-height:1.1;color:#4a2408;text-wrap:balance}
.sheet h3{margin:16px 0 4px;font-size:18px;color:var(--crimson);border-bottom:1px solid rgba(168,116,12,.35);padding-bottom:3px}
.panel .muted,.sheet .muted{color:var(--ink2)}
.sheet p{margin:6px 0}

/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;background:var(--noise),radial-gradient(80% 60% at 50% 40%,#2a3d22,#0d0905);transition:opacity .5s}
#splash.gone{opacity:0;pointer-events:none}
#splash h1{margin:0;font:900 clamp(36px,11vw,58px)/1 "Cinzel Decorative",Cinzel,Georgia,serif}
#splash p{margin:14px 0 0;color:#e8d6a6;font-family:Cinzel,Georgia,serif;letter-spacing:.08em}
.grow{display:flex;gap:10px;justify-content:center;margin-top:22px}
.grow svg{width:34px;height:51px;animation:grow 1.2s ease-in-out infinite;transform-origin:50% 100%}
.grow svg:nth-child(2){animation-delay:.2s}.grow svg:nth-child(3){animation-delay:.4s}
@keyframes grow{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.05);opacity:1}}

/* ---- home ---- */
#scr-home{padding-bottom:calc(24px + var(--safe-b))}
.hero{position:relative;height:clamp(250px,44vh,380px);overflow:hidden;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.65)}
.hero>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,9,5,0) 45%,rgba(13,9,5,.15) 65%,rgba(13,9,5,.9) 100%);pointer-events:none}
.hero .ttl{position:absolute;left:0;right:0;bottom:16px;z-index:2;text-align:center;padding:0 14px}
.title{margin:0;font:900 clamp(38px,11.5vw,58px)/1.02 "Cinzel Decorative",Cinzel,Georgia,serif;text-wrap:balance}
.sub{margin:6px 0 0;text-align:center;color:#f3e3b8;font-size:15px;text-shadow:0 2px 6px #000}
.homecard{margin:18px 14px 0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px}
.resume{padding:12px 14px;border-radius:14px;background:rgba(255,250,235,.6);border:1px dashed #a8740c;display:flex;gap:10px;align-items:center;color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--ink2);font:700 12px Cinzel,Georgia,serif;letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#a8740c,transparent)}

/* ---- lobby / join ---- */
.pane{padding:calc(14px + var(--safe-t)) 14px calc(24px + var(--safe-b))}
.code{font:800 34px/1 Cinzel,Georgia,serif;letter-spacing:.16em;color:var(--crimson);text-align:center;padding:12px;border-radius:14px;background:#fffaf0;border:2px dashed #c99a2e;margin:10px 0;box-shadow:inset 0 2px 6px rgba(120,80,20,.2)}
.plist{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:linear-gradient(#fffdf6,#f6ead0);border:1px solid #d4b779;min-height:56px;box-shadow:0 2px 0 #c9aa6a}
.plist li .nm{flex:1;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:700 11px Cinzel,Georgia,serif;letter-spacing:.06em;padding:4px 9px;border-radius:99px;background:linear-gradient(#f7d461,#c98b12);color:#3a2104;border:1px solid #8a5a0c}
.dot{width:10px;height:10px;border-radius:50%;background:#8a8070;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.dot.on{background:#3fd27a;box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 8px #3fd27a}
.mini{width:30px;height:44px;flex:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:50px;height:58px;border-radius:14px;border:2px solid #d4b779;background:linear-gradient(#fffdf6,#f1e2bf);padding:2px;display:grid;place-items:center}
.sw[aria-pressed=true]{border-color:var(--crimson);box-shadow:0 0 0 3px rgba(142,27,46,.25),0 0 14px rgba(233,180,58,.6)}
.sw:disabled{opacity:.3}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1.5px solid #a8844a;box-shadow:0 2px 0 #c9aa6a}
.seg button{flex:1;min-height:44px;border:0;border-left:1px solid #d4b779;background:linear-gradient(#fffdf6,#f1e2bf);color:var(--ink);font-weight:800;font-size:14px;padding:6px 4px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:linear-gradient(#b52a40,#7a1424);color:#fff3e0;text-shadow:0 1px 0 #3a0610}
.seg button:disabled{opacity:.45}
.set{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.set b{font:700 13px Cinzel,Georgia,serif;letter-spacing:.04em;color:var(--ink2)}
select.sel{min-height:46px;border-radius:12px;border:1.5px solid #a8844a;background:#fffaf0;color:var(--ink);padding:6px 10px;font-weight:800}

/* ---- game ---- */
.gbar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 10px 6px;
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px),linear-gradient(180deg,#4a2e18,#24150b);border-bottom:2px solid #b8862a;box-shadow:0 2px 0 #3a2410,0 8px 18px rgba(0,0,0,.55);position:relative;z-index:3}
.gbar h1{margin:0;flex:1;font:900 clamp(15px,4.7vw,21px)/1.1 "Cinzel Decorative",Cinzel,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid #b8862a;background:linear-gradient(#5a3a20,#2e1c0e);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,220,150,.25)}
.conn:empty{display:none}
@media(max-width:400px){.conn .txt{display:none}}
.conn{display:flex;align-items:center;gap:6px;font:700 12px Cinzel,Georgia,serif;letter-spacing:.05em;white-space:nowrap;color:#f0dca8;padding:0 6px}
.conn.bad .dot{background:#f0a23a;box-shadow:0 0 8px #f0a23a}
.players{flex:none;display:flex;gap:7px;overflow-x:auto;padding:7px 8px 6px;scrollbar-width:none}
.players::-webkit-scrollbar{display:none}
.pc{flex:none;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:99px;background:linear-gradient(180deg,rgba(255,240,200,.14),rgba(255,240,200,.04));border:1px solid rgba(233,180,58,.35);min-height:46px;max-width:150px}
.pc .medal{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff9e8,#e9d6a8 70%,#b8925a);box-shadow:0 0 0 2px #c99a2e,0 0 0 3px #4a2e10,0 3px 6px rgba(0,0,0,.5)}
.pc .medal{position:relative}.pc .medal svg{width:22px;height:33px;margin-top:2px}
.pc .ini{position:absolute;right:-5px;top:-4px;min-width:20px;height:20px;padding:0 3px;border-radius:10px;background:#fff;border:2px solid #2a1a0c;color:#2a1a0c;font:900 11px/16px Nunito,sans-serif;text-align:center}
.pc.turn{border-color:#ffd66a;background:linear-gradient(180deg,rgba(255,214,106,.32),rgba(255,214,106,.08));box-shadow:0 0 0 2px rgba(255,214,106,.35),0 0 16px rgba(255,214,106,.45);animation:turnpulse 1.8s ease-in-out infinite}
@keyframes turnpulse{50%{box-shadow:0 0 0 2px rgba(255,214,106,.6),0 0 24px rgba(255,214,106,.7)}}
.pc.left{opacity:.4}
.pc .nm{font-weight:900;font-size:15px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff4d8}
.pc .cards{display:flex;gap:3px;margin-top:3px}
.pc .cards i{width:10px;height:14px;border-radius:2px;background:rgba(255,255,255,.14);border:1px solid rgba(255,230,170,.3);display:block}
.pc .cards i.got{background:linear-gradient(#fff0b0,#e9b43a 45%,#a8740c);border-color:#6b4508;box-shadow:0 0 6px rgba(255,214,106,.8)}
#scr-game.on{height:100vh;height:100dvh;overflow:hidden}
.boardwrap{position:relative;flex:1 1 auto;min-height:220px;margin:2px 8px 0;border-radius:16px;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 80% at 50% 40%,#2a3d22,#0f0a05);box-shadow:0 0 0 2px #f3d27a,0 0 0 5px #8a5a14,0 0 0 7px #2a1a0a,0 14px 34px rgba(0,0,0,.7)}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:none}
#dim{transition:opacity .35s}
#v3{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.v3load{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#2a3d22,#0f0a05);color:#f3e3b8;font:700 16px Cinzel,Georgia,serif;z-index:3}
.v3load svg{animation:grow 1.2s ease-in-out infinite;transform-origin:50% 100%}
.v3bar{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;justify-content:space-between;z-index:2;pointer-events:none}
.v3bar .btn{pointer-events:auto;min-height:44px;font-size:14px;box-shadow:0 3px 0 #4a2d05,0 6px 14px rgba(0,0,0,.5)}
.zb3{font:900 16px/1 Cinzel,Georgia,serif}
.v3map{position:absolute;left:10px;bottom:10px;width:30%;max-width:132px;aspect-ratio:800/1160;border-radius:14px;border:3px solid #e9b43a;box-shadow:0 0 0 2px #3a2405,0 6px 16px rgba(0,0,0,.55);z-index:2;background:#3d6b33;touch-action:manipulation;transition:width .25s ease,max-width .25s ease}
.v3map.big{width:62%;max-width:300px}
.zoombar{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:8px;z-index:2}
.zb{opacity:.92;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#3a2104;border:2px solid #5a3a06;
  background:radial-gradient(circle at 40% 30%,#fff6cc,#f2c84e 45%,#c98b12);box-shadow:0 3px 0 #4a2d05,0 6px 14px rgba(0,0,0,.55)}
.zb:active{transform:translateY(2px)}
.wishbar{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,rgba(255,240,200,.16),rgba(255,240,200,.05));border:1px solid rgba(233,180,58,.55);border-radius:12px;padding:3px 10px 3px 4px;text-align:left;min-height:52px}
.wishbar .card{width:34px;height:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)) drop-shadow(0 0 6px rgba(255,214,106,.6))}
.wishbar .wt{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.wishbar small{font:700 11px Cinzel,Georgia,serif;letter-spacing:.06em;color:#f0d79a}
.wishbar b{font:800 17px/1.15 Nunito,sans-serif;color:#fff6dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wishbar.flip .card{animation:flip3 .9s cubic-bezier(.3,.7,.3,1)}
@keyframes flip3{0%{transform:rotateY(0)}45%{transform:rotateY(90deg) scale(1.15)}55%{transform:rotateY(-90deg) scale(1.15)}100%{transform:rotateY(0)}}
.dock{position:relative;flex:none;color:var(--ink);border-radius:24px 24px 0 0;padding:12px 14px calc(12px + var(--safe-b));z-index:5;
  background:var(--noise),radial-gradient(130% 120% at 50% 0%,#fbf3de 0%,#f0dfb8 65%,#dcc08a 100%);
  border-top:3px solid #c99a3c;box-shadow:0 -2px 0 #5a3a16,0 -12px 30px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.7);margin-top:10px}
.dock::before{content:"";position:absolute;left:50%;top:6px;width:120px;height:10px;transform:translateX(-50%);background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 10'><path d='M0 5 H44 M76 5 H120' stroke='%23a8740c' stroke-width='1'/><path d='M60 0 L66 5 L60 10 L54 5 Z' fill='%23c99a2e'/><circle cx='48' cy='5' r='1.6' fill='%23a8740c'/><circle cx='72' cy='5' r='1.6' fill='%23a8740c'/></svg>") center/contain no-repeat;opacity:.9}
.dock .tick{font-size:14px;color:var(--ink2);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 0 2px;font-style:italic}
.drow{display:flex;align-items:center;gap:10px}
.dock .who{flex:1;display:flex;align-items:center;gap:8px;font:800 20px/1.15 Cinzel,Georgia,serif;color:#2a1204}
.dock .who svg{flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.dock .hint{font-size:17px;color:#2a1a0c;margin:6px 0 8px;line-height:1.35;min-height:22px}
.dock .acts{display:flex;gap:8px;flex-wrap:wrap}
.dock .acts:empty{display:none}
.dock .acts .btn{flex:1 1 140px}
/* 3D dice */
.dice3{display:flex;gap:12px;align-items:center;padding-right:4px}
.dice3.hide{visibility:hidden}
.die3{width:50px;height:50px;padding:0;border:0;background:none;perspective:320px;border-radius:12px;position:relative}
.die3::before{content:"";position:absolute;left:4px;right:4px;bottom:-7px;height:10px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.45),transparent 70%)}
.cube{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.18,.9,.22,1.02)}
.cube.nt{transition:none}
.f{position:absolute;inset:0;border-radius:11px;background:radial-gradient(circle at 30% 25%,#fffef8,#f3ead6 60%,#d9c8a4);border:1.5px solid #b49d74;box-shadow:inset 0 0 7px rgba(90,60,20,.25);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f i{width:9px;height:9px;border-radius:50%;place-self:center;background:radial-gradient(circle at 35% 30%,#6a5a48,#120a04);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.f i.e{visibility:hidden}
.f1 i:not(.e){background:radial-gradient(circle at 35% 30%,#ff7a88,#8e1b2e);width:13px;height:13px}
.f1{transform:rotateY(0deg) translateZ(25px)}.f6{transform:rotateY(180deg) translateZ(25px)}.f3{transform:rotateY(90deg) translateZ(25px)}
.f4{transform:rotateY(-90deg) translateZ(25px)}.f5{transform:rotateX(90deg) translateZ(25px)}.f2{transform:rotateX(-90deg) translateZ(25px)}
.die3.sel{box-shadow:0 0 0 3px #ffd66a,0 0 18px rgba(255,214,106,.9)}
.die3.used{opacity:.35;filter:grayscale(1)}
.dice3.idle .die3{opacity:.45}
.spells{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.spell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:54px;padding:7px 10px;border-radius:14px;border:1.5px solid #a8844a;background:var(--noise),linear-gradient(#fffdf6,#f1e2bf);color:var(--ink);box-shadow:0 2px 0 #b8925a,inset 0 1px 0 #fff}
.spell b{font:700 14px/1.15 Cinzel,Georgia,serif;color:#5a1a10}.spell span{font-size:12px;color:#6b4e2a;line-height:1.2}
.spell:active{transform:translateY(1px)}
.spell:disabled{opacity:.4}

/* board effects */
.tgt .ring{fill:rgba(255,226,138,.35);stroke:#fff3b0;stroke-width:5;animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tgt .spin{fill:none;stroke:#ffd66a;stroke-width:2.5;stroke-dasharray:6 8;animation:rot 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.88);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.tlabel{font:800 22px Cinzel,Georgia,serif;fill:#fff6d8;paint-order:stroke;stroke:#3b1a06;stroke-width:5px}
.bob{animation:bob .8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.aura{animation:rot 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pine{transition:filter .2s}
.pine.glow{filter:drop-shadow(0 0 5px #fff3b0) drop-shadow(0 0 12px #ebb63c)}
.pine.picked{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 16px #ff5a6a)}
.pine.lift>g{animation:lift .55s cubic-bezier(.2,.8,.3,1.2) forwards}
.pine.lifted>g{transform:translate(12px,-50px) rotate(10deg)}
@keyframes lift{from{transform:none}to{transform:translate(12px,-50px) rotate(10deg)}}
.hop{animation:hop .17s ease-out}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-16px)}100%{transform:translateY(0)}}
.poof{animation:poof .55s ease-out}
@keyframes poof{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
.fly{animation:fly 7s ease-in-out infinite;transform-box:fill-box}
.fly.b{animation-name:flyb;animation-duration:9s}.fly.c{animation-name:flyc;animation-duration:11s}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.1}25%{opacity:1}50%{transform:translate(18px,-22px);opacity:.35}75%{transform:translate(-10px,-34px);opacity:1}}
@keyframes flyb{0%,100%{transform:translate(0,0);opacity:.9}33%{transform:translate(-22px,12px);opacity:.2}66%{transform:translate(10px,26px);opacity:1}}
@keyframes flyc{0%,100%{transform:translate(0,0);opacity:.3}50%{transform:translate(26px,16px);opacity:1}}
.shim{animation:shim 3s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:0}50%{opacity:.9}}

/* sheet & toasts */
.veil{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(20,12,5,.55),rgba(8,5,2,.85));display:none;align-items:flex-end;justify-content:center;z-index:30;padding:10px 10px calc(10px + var(--safe-b));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.veil.on{display:flex}
@media(min-width:600px){.veil{align-items:center}}
.sheet{width:100%;max-width:500px;max-height:calc(100dvh - 30px);overflow:auto;animation:rise .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translateY(30px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .acts .btn{flex:1 1 140px}
.reveal{display:grid;place-items:center;margin:18px 0 6px;position:relative}
.reveal svg{width:min(260px,70vw);height:auto;overflow:visible}
.rays{animation:rot 14s linear infinite;transform-box:fill-box;transform-origin:center;opacity:0;animation:rot 14s linear infinite,fadein .5s .6s forwards}
@keyframes fadein{to{opacity:1}}
.rv-pine{animation:rvlift 1.1s .25s cubic-bezier(.2,.8,.3,1.1) forwards}
@keyframes rvlift{to{transform:translate(66px,-70px) rotate(14deg)}}
.rv-tok{opacity:0;animation:poof .45s .7s ease-out forwards;transform-box:fill-box;transform-origin:center}
.big{font:800 23px/1.2 Cinzel,Georgia,serif;text-align:center;margin:4px 0;color:#4a2408}
.center{text-align:center}
.curtain{display:grid;place-items:center;gap:12px;padding:18px 0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.grid figure{margin:0;text-align:center;font-size:12.5px;font-weight:800;line-height:1.2}
.grid figure svg{width:100%;height:auto}
.card.small{width:118px;height:auto;display:inline-block}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.rules ol{padding-left:20px;margin:6px 0}.rules li{margin:4px 0}
.loglist{list-style:none;padding:0;margin:0;font-size:14px}
.loglist li{padding:7px 0;border-bottom:1px solid rgba(168,116,12,.3)}
#toasts{position:fixed;left:0;right:0;top:calc(124px + var(--safe-t));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{font-size:16px!important;max-width:92vw;background:linear-gradient(180deg,rgba(40,24,10,.95),rgba(20,12,5,.95));color:#fff3d6;border:1px solid #c99a3c;padding:9px 16px;border-radius:99px;font-weight:800;font-size:14.5px;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,150,.2);animation:rise .22s ease-out}
.toast::before{content:"\2726  ";color:#ffd66a}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:35}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(168,116,12,.3);border-top-color:#a8740c;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.crown{display:block;margin:0 auto 4px;width:84px;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
/* chat */
.chatbtn{position:relative;flex:none}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#d8384e;color:#fff;font:900 12px/22px Nunito,sans-serif;text-align:center;border:2px solid #2a1a0a}
.chatlist{display:flex;flex-direction:column;gap:10px;max-height:min(46vh,420px);overflow-y:auto;padding:4px 2px 8px;margin:4px 0 8px;overscroll-behavior:contain}
.chatlist .empty{text-align:center;color:var(--ink2);padding:18px 6px}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:86%}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg .by{display:flex;align-items:center;gap:5px;font:800 13px/1.2 Nunito,sans-serif;color:var(--ink2);margin:0 4px 2px}
.msg .by svg{width:14px;height:21px}
.bub{padding:9px 13px;border-radius:16px 16px 16px 5px;background:#fffdf6;border:1px solid #d4b779;color:var(--ink);font-size:17px;line-height:1.35;overflow-wrap:anywhere;box-shadow:0 2px 0 #c9aa6a}
.msg.mine .bub{border-radius:16px 16px 5px 16px;background:linear-gradient(#fff3c2,#f2d27a);border-color:#a8740c}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{min-height:44px;padding:6px 12px;border-radius:99px;border:1.5px solid #a8844a;background:linear-gradient(#fffdf6,#f1e2bf);color:var(--ink);font-weight:800;font-size:15px}
.chatform{display:flex;gap:8px;align-items:stretch}
.chatform input{flex:1;min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid #b8925a;background:#fffaf0;color:var(--ink);font-size:17px}
.chatform input:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 0 3px rgba(233,180,58,.35)}
html.bigtext .bub{font-size:20px}html.bigtext .quick button{font-size:17px}html.bigtext .chatform input{font-size:19px}
html.bigtext .dock .who{font-size:23px}html.bigtext .dock .hint{font-size:20px}html.bigtext .dock .tick{font-size:16px}
html.bigtext .btn{font-size:19px;min-height:58px}html.bigtext .btn.small{font-size:16px;min-height:50px}
html.bigtext .sheet p,html.bigtext .panel p,html.bigtext .rules li,html.bigtext .loglist{font-size:19px}html.bigtext .big{font-size:26px}
html.bigtext .pc .nm{font-size:17px}html.bigtext .wishbar b{font-size:19px}html.bigtext .plist li{font-size:19px}html.bigtext .field label,html.bigtext .set b{font-size:15px}
html.bigtext .spell b{font-size:16px}html.bigtext .spell span{font-size:14px}html.bigtext .toast{font-size:18px!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.rv-pine{transform:translate(66px,-70px) rotate(14deg)}.rv-tok,.rays{opacity:1}}
</style>
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false"></svg>
<div id="splash"><div><h1 class="goldtext">Whispering<br>Woods</h1><p>Painting the forest…</p>
  <div class="grow" aria-hidden="true"><svg viewBox="0 0 80 120"><use href="#pine"/></svg><svg viewBox="0 0 80 120"><use href="#pine"/></svg><svg viewBox="0 0 80 120"><use href="#pine"/></svg></div></div></div>

<section id="scr-home" class="scr col"></section>
<section id="scr-join" class="scr col pane"></section>
<section id="scr-lobby" class="scr col pane"></section>
<section id="scr-local" class="scr col pane"></section>
<section id="scr-game" class="scr col">
  <header class="gbar">
    <button class="icon" id="menuBtn" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#f3d27a" stroke-width="2.5" stroke-linecap="round"/></svg></button>
    <button class="wishbar" id="wish" data-act="wishBig" aria-label="The King's wish"></button>
    <button class="icon chatbtn" id="chatBtn" data-act="chat" aria-label="Chat" hidden><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="none" stroke="#f3d27a" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 9.5h10M7 13h6" stroke="#f3d27a" stroke-width="2" stroke-linecap="round"/></svg><span class="badge" id="chatBadge" hidden></span></button>
    <div class="conn" id="conn"></div>
  </header>
  <div class="players" id="players" role="list"></div>
  <div class="boardwrap" id="boardwrap">
    <svg id="board" viewBox="0 0 800 1160" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Game board">
      <defs><radialGradient id="gHole" cx=".5" cy=".5" r=".5"><stop offset=".62" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient><mask id="spotMask" maskUnits="userSpaceOnUse" x="-600" y="-600" width="2000" height="2400"><rect x="-600" y="-600" width="2000" height="2400" fill="#fff"/><g id="holes"></g></mask></defs>
      <g id="boardArt"></g>
      <g id="amb"></g>
      <g id="pieces"></g>
      <rect id="dim" x="-600" y="-600" width="2000" height="2400" fill="#06120a" mask="url(#spotMask)" opacity="0"/>
      <g id="hl"></g>
      <g id="hl2"></g>
      <g id="fx"></g>
    </svg>
    <canvas id="v3" hidden></canvas>
      <canvas id="v3map" class="v3map" hidden aria-label="Map of the forest — tap to make it bigger"></canvas>
    <div id="v3load" class="v3load" hidden><div><svg viewBox="0 0 80 120" width="44" height="66" aria-hidden="true"><use href="#pine"/></svg><p>Growing the 3D forest…</p></div></div>
    <div id="v3bar" class="v3bar" hidden><button class="btn small" id="v3above" data-act="v3above">View from above</button><button class="btn small parch" data-act="goFlat">Flat board</button></div>
    <div class="zoombar" role="group" aria-label="Zoom">
      <button class="zb zb3" data-act="go3d" aria-label="Walk in the 3D forest">3D</button>
      <button class="zb" data-act="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button class="zb" data-act="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button class="zb" data-act="zoomAll" aria-label="Show the whole board"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <div class="dock" id="dock" aria-live="polite">
    <div class="tick" id="dTick"></div>
    <div class="drow"><div class="who" id="dWho"></div><div class="dice3 idle" id="dDice"></div></div>
    <div class="hint" id="dHint"></div>
    <div class="acts" id="dActs"></div>
  </div>
</section>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<script>
/* ============================================================
   ART — every picture in the game is drawn here as vector SVG.
   All artwork is original. Treasures come from public-domain tales.
   ============================================================ */
const TREASURES = [
  { id: 'slipper', name: 'Glass Slipper', tale: 'Cinderella' },
  { id: 'mirror',  name: 'Magic Mirror', tale: 'Snow White' },
  { id: 'goose',   name: 'Golden Goose', tale: 'The Golden Goose' },
  { id: 'wheel',   name: 'Spinning Wheel', tale: 'Sleeping Beauty' },
  { id: 'boots',   name: 'Seven-League Boots', tale: 'Hop-o’-My-Thumb' },
  { id: 'ball',    name: 'Golden Ball', tale: 'The Frog Prince' },
  { id: 'basket',  name: 'Grandmother’s Basket', tale: 'Little Red Riding Hood', ref: 'Grandmother’s Basket' },
  { id: 'lamp',    name: 'Wonderful Lamp', tale: 'Aladdin' },
  { id: 'beans',   name: 'Magic Beans', tale: 'Jack and the Beanstalk' },
  { id: 'pea',     name: 'The Pea', tale: 'The Princess and the Pea', ref: 'the Pea' },
  { id: 'house',   name: 'Gingerbread House', tale: 'Hansel and Gretel' },
  { id: 'tower',   name: 'Rapunzel’s Tower', tale: 'Rapunzel', ref: 'Rapunzel’s Tower' },
  { id: 'hat',     name: 'Plumed Hat', tale: 'Puss in Boots' },
];

const COLORS = [
  { id: 'ruby',      name: 'Ruby',      c: '#d8383a', l: '#ff8f80', d: '#7d1418' },
  { id: 'sapphire',  name: 'Sapphire',  c: '#2f6fd8', l: '#86b6ff', d: '#163a80' },
  { id: 'sun',       name: 'Sunflower', c: '#f3c22b', l: '#fff0a0', d: '#9a6d05' },
  { id: 'snow',      name: 'Snow',      c: '#eeeae0', l: '#ffffff', d: '#8d877a' },
  { id: 'plum',      name: 'Plum',      c: '#8f4fc6', l: '#d0a6f5', d: '#4a2072' },
  { id: 'tangerine', name: 'Tangerine', c: '#f0842a', l: '#ffc185', d: '#8f4108' },
];

const OL = '#3a2616'; // outline ink

function sparkle(x, y, s, fill = '#fff6c2') {
  return `<path d="M${x} ${y - s}Q${x + s * .18} ${y - s * .18} ${x + s} ${y}Q${x + s * .18} ${y + s * .18} ${x} ${y + s}Q${x - s * .18} ${y + s * .18} ${x - s} ${y}Q${x - s * .18} ${y - s * .18} ${x} ${y - s}Z" fill="${fill}" stroke="#d29a16" stroke-width="1"/>`;
}

/* Shared gradients/patterns, injected once into a hidden SVG. */
function artDefs() {
  const pawnGrads = COLORS.map((c, i) => `
    <linearGradient id="gPawn${i}" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="${c.l}"/><stop offset=".45" stop-color="${c.c}"/><stop offset="1" stop-color="${c.d}"/>
    </linearGradient>`).join('');
  return `
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".45" stop-color="#f4c33c"/><stop offset="1" stop-color="#c2860e"/></linearGradient>
  <radialGradient id="gGoldBall" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fffbe0"/><stop offset=".35" stop-color="#f7cf4a"/><stop offset="1" stop-color="#a86d06"/></radialGradient>
  <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fbff"/><stop offset=".5" stop-color="#b4e3f7"/><stop offset="1" stop-color="#69b6e0"/></linearGradient>
  <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fdff"/><stop offset=".5" stop-color="#bcd6e6"/><stop offset="1" stop-color="#7f9fb8"/></linearGradient>
  <linearGradient id="gLeather" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c07c46"/><stop offset=".6" stop-color="#9a5a2c"/><stop offset="1" stop-color="#6e3a18"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79a5c"/><stop offset="1" stop-color="#8f5426"/></linearGradient>

/* ---------- Pieces ---------- */
function tierPath(cx, top, bot, hw, teeth) {
  // a pine tier with a jagged, needle-tipped lower edge
  const m = top + (bot - top) * .5;
  let d = `M${cx} ${top}C${(cx + hw * .28).toFixed(1)} ${m.toFixed(1)} ${(cx + hw * .7).toFixed(1)} ${(bot - 8).toFixed(1)} ${cx + hw} ${bot}`;
  for (let i = 1; i <= teeth * 2; i++) {

<script>
/* ============================================================
   BOARD — path network, tree spots and the painted board.
   Original layout: village (bottom) → forest trails → river →
   stone bridge → horseshoe space → castle key space (top).
   ============================================================ */
const BW = 800, BH = 1160;
const BOARD = (() => {
  const J = { S: [400, 1082], LA: [146, 934], LB: [112, 704], MA: [394, 900], MB: [410, 722], RA: [656, 936], RB: [690, 698], J: [400, 566] };
  const SEGS = [
    ['S', 'LA', [[300, 1094], [196, 1046]]],
    ['LA', 'LB', [[92, 852], [160, 774]]],
    ['LB', 'J', [[140, 612], [286, 588]]],
    ['S', 'MA', [[436, 1004]]],
    ['MA', 'MB', [[342, 818]]],
    ['MB', 'J', [[462, 646]]],
    ['S', 'RA', [[516, 1072], [622, 1026]]],
    ['RA', 'RB', [[748, 852], [724, 770]]],
    ['RB', 'J', [[648, 604], [508, 592]]],
    ['LA', 'MA', [[244, 956], [318, 870]]],
    ['MA', 'RA', [[494, 938], [584, 902]]],
    ['LB', 'MB', [[214, 690], [318, 760]]],
    ['MB', 'RB', [[520, 694], [606, 712]]],
  ];
  const nodes = [], adj = [];
  const add = (x, y, type = 'path') => { nodes.push({ id: nodes.length, x, y, type, tree: -1 }); adj.push([]); return nodes.length - 1; };
  const link = (a, b) => { adj[a].push(b); adj[b].push(a); };
  const jid = {};
  for (const k in J) jid[k] = add(J[k][0], J[k][1], k === 'S' ? 'star' : 'path');

  // Catmull-Rom through points, sampled densely
  function spline(pts) {
    const out = [];
    const P = [pts[0], ...pts, pts[pts.length - 1]];
    for (let i = 1; i < P.length - 2; i++) {
      for (let s = 0; s < 24; s++) {
        const t = s / 24, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => .5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        out.push([f(P[i - 1][0], P[i][0], P[i + 1][0], P[i + 2][0]), f(P[i - 1][1], P[i][1], P[i + 1][1], P[i + 2][1])]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }
  const trails = [];
  for (const [a, b, mid] of SEGS) {
    const pts = spline([J[a], ...mid, J[b]]);
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = cum[cum.length - 1];
    const n = Math.max(1, Math.round(L / 64) - 1);
    let prev = jid[a];
    for (let k = 1; k <= n; k++) {
      const d = L * k / (n + 1);
      let i = 1; while (cum[i] < d) i++;
      const r = (d - cum[i - 1]) / (cum[i] - cum[i - 1]);
      const id = add(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * r, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * r);
      link(prev, id); prev = id;
    }
    link(prev, jid[b]);
    trails.push(pts);
  }
  // Castle road: junction → bridge → horseshoe → courtyard → key
  const BR = add(400, 490, 'bridge');
  const H = add(400, 412, 'horseshoe');
  const C1 = add(384, 340, 'path');
  const K = add(400, 268, 'key');
  link(jid.J, BR); link(BR, H); link(H, C1); link(C1, K);
  trails.push(spline([[400, 566], [400, 490], [402, 412], [384, 340], [400, 268]]));
  nodes[H].zone = nodes[C1].zone = nodes[K].zone = 'castle';

  // Pick the 13 tree spaces: forest spaces with room for a pine beside them, spread out evenly
  const samples = trails.flat();
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function spotFor(n, blues, trees) {
    let best = null, bs = -1e9;
    for (let k = 0; k < 24; k++) for (const off of [46, 54, 62, 70]) {
      const ang = k * Math.PI / 12, x = n.x + Math.cos(ang) * off, y = n.y + Math.sin(ang) * off * .92;
      if (x < 48 || x > BW - 48 || y < 610 || y > 1028) continue;
      const segD = (px, py) => { const cy = Math.max(y - 64, Math.min(y - 6, py)); return Math.hypot(px - x, py - cy); };
      let clr = 1e9;
      for (const s of samples) clr = Math.min(clr, segD(s[0], s[1]));
      for (const m of nodes) if (m !== n) clr = Math.min(clr, segD(m.x, m.y) - 4);
      if (blues.some(b => b !== n && Math.hypot(b.x - x, b.y - y) < off + 22)) continue;
      const sep = trees.length ? Math.min(...trees.map(t => Math.hypot(t.x - x, t.y - y))) : 200;
      if (sep < 64) continue;
      const sc = Math.min(clr, 44) + Math.min(sep, 110) * .06 - (off - 46) * .2;
      if (sc > bs) { bs = sc; best = { x, y, clr }; }
    }
    return best;
  }
  const cand = nodes.filter(n => n.type === 'path' && !n.zone && adj[n.id].length === 2 && n.y > 590 && n.y < 1040)
    .filter(n => { const sp = spotFor(n, [], []); return sp && sp.clr >= 34; });
  const chosen = [];
  const anchors = [nodes[jid.S], nodes[jid.J]];
  chosen.push(cand.reduce((b, n) => (dist(n, { x: 112, y: 860 }) < dist(b, { x: 112, y: 860 }) ? n : b), cand[0]));
  while (chosen.length < 13) {
    let best = null, bd = -1;
    for (const n of cand) {
      if (chosen.includes(n) || chosen.some(c => adj[c.id].includes(n.id))) continue;
      const d = Math.min(...chosen.map(c => dist(c, n)), ...anchors.map(a => dist(a, n) * 1.15));
      if (d > bd) { bd = d; best = n; }
    }
    if (!best) break;
    chosen.push(best);
  }
  const trees = [];
  const blues = chosen.slice().sort((a, b) => a.y - b.y || a.x - b.x);
  blues.forEach((n, i) => { n.type = 'blue'; n.tree = i; });
  blues.forEach((n, i) => {
    const sp = spotFor(n, blues, trees) || spotFor(n, [], []) || { x: n.x + 52, y: n.y };
    trees.push({ i, node: n.id, x: sp.x, y: sp.y });
  });
  return { nodes, adj, trees, trails, STAR: jid.S, KEY: K, HORSE: H, BRIDGE: BR, JUNCTION: jid.J };
})();

/* ---------- Movement on the network ---------- */
/* All end spaces reachable with exactly d steps without turning back (one direction per die). */
function reachable(from, d) {
  const res = new Map(), adj = BOARD.adj;
  const path = [from], seen = new Set([from]);
  (function walk(u, left) {
    if (left === 0) { if (!res.has(u)) res.set(u, path.slice()); return; }
    for (const v of adj[u]) {
      if (seen.has(v)) continue;
      seen.add(v); path.push(v);
      walk(v, left - 1);
      path.pop(); seen.delete(v);
    }
  })(from, d);
  res.delete(from);
  return res;
}

</script>

    if (!free(x, y, k < .25 ? 46 : 26)) continue;
    let h;
    if (k < .25) h = bushSVG2(x, y, .8 + rnd() * .5, rnd());
    else if (k < .48) h = flowersSVG2(x, y, rnd());
    else if (k < .62) h = mushroomSVG2(x, y, .8 + rnd() * .5, rnd());
    else if (k < .76) h = fernSVG(x, y, .8 + rnd() * .5, rnd());
    else if (k < .92) h = rockSVG2(x, y, .7 + rnd() * .6);
    else h = logSVG(x, y, .8 + rnd() * .3, rnd());
    items.push({ y, h });
  }
  // the edge woods and the grove under the hills
  for (let i = 0; i < 90; i++) {
    const side = i % 2, x = side ? BW - 8 - rnd() * 40 : 8 + rnd() * 40, y = 330 + rnd() * 720;
    if (nearPath(x, y, 44) || nearTree(x, y, 48)) continue;
    items.push({ y, h: treeSVG2(x, y, .9 + rnd() * .45, rnd()) });
  }
  for (const [x, y, s] of [[80, 370, 1.1], [168, 352, .9], [626, 362, 1], [722, 384, 1.15], [302, 372, .85], [520, 372, .9], [36, 560, 1.1], [764, 560, 1.1], [120, 400, .8], [690, 410, .8]]) if (!nearPath(x, y, 40)) items.push({ y, h: treeSVG2(x, y, s, rnd()) });
  items.sort((a, b) => a.y - b.y);
  if (!ground) o += items.map(i => i.h).join('');

  /* --- light: sunbeams and vignette --- */
  if (!simple && !ground) o += `<g opacity=".4">${[[760, 0, 520, 1160, 640, 1160], [800, 60, 650, 1160, 760, 1160], [640, 0, 300, 1160, 380, 1160]].map(([a, b, c, d, e, g]) => `<path d="M${a} ${b} L${c} ${d} L${e} ${g} Z" fill="url(#gRay)"/>`).join('')}</g>`;
  if (!ground) o += `<rect width="${BW}" height="${BH}" fill="url(#gVignette)"/>`;

  /* --- the spaces themselves, crisp on top --- */
  let sd = 3;
  if (!ground) for (const n of nodes) o += spaceSVG2(n, () => (sd = (sd * 16807) % 2147483647) / 2147483647);
  return o;
}

<script>
/* ============================================================
   ENGINE — pure rules (Classic Play). Every action returns a new
   state; nothing here touches the screen or the network.
   ============================================================ */
const TEST = /[?&]test=1/.test(location.search);
function rint(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rid(n = 10) { const A = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < n; i++) s += A[rint(A.length)]; return s; }
function roomCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 6; i++) s += A[rint(A.length)]; return s; }

const ENG = {
  newLobby(room, host) {
    return { app: 'ww1', room, v: 0, w: '', gid: '', phase: 'lobby', host: host.id,
      settings: { target: 3, helper: 0, first: 'random' },
      players: [{ id: host.id, name: host.name, color: host.color }],
      turn: 0, t: null, ld: null, layout: [], deck: [], winner: null, log: [], n: 0 };
  },
  maxTarget(nPlayers) { return Math.max(2, Math.min(4, Math.floor(12 / Math.max(2, nPlayers)) + 1)); },
  cur(s) { return s.players[s.turn]; },
  player(s, id) { return s.players.find(p => p.id === id); },
  active(s) { return s.players.filter(p => !p.left); },
  occupant(s, node, except) { return node === BOARD.STAR ? null : s.players.find(p => !p.left && p.id !== except && p.pos === node); },
  wish(s) { return s.deck[0] || null; },
  canMoveDie(s, i) { const p = ENG.cur(s); return reachable(p.pos, s.t.dice[i]).size > 0; },

  apply(s0, a, by) {
    const s = JSON.parse(JSON.stringify(s0));
    const fail = (m) => { throw new Error(m); };
    const log = (e) => { e.n = ++s.n; s.log.push(e); if (s.log.length > 40) s.log.shift(); };
    const isHost = by === s.host;

    const startTurn = () => { s.t = { step: 'start', dice: null, rem: [], dbl: false }; };
    const nextTurn = () => {
      const n = s.players.length;
      for (let i = 1; i <= n; i++) { const j = (s.turn + i) % n; if (!s.players[j].left) { s.turn = j; break; } }
      startTurn();
      log({ k: 'turn', p: ENG.cur(s).id });
    };
    const endIfStuck = () => {
      const p = ENG.cur(s);
      if (s.t.rem.every(i => reachable(p.pos, s.t.dice[i]).size === 0)) { log({ k: 'stuck', p: p.id }); nextTurn(); }
    };
    const land = (p, to, path, via) => {
      p.pos = to;
      log({ k: 'move', p: p.id, path, via });
      const o = ENG.occupant(s, to, p.id);
      if (o) { o.pos = BOARD.STAR; log({ k: 'bump', p: p.id, o: o.id }); }
      const node = BOARD.nodes[to];
      if (node.type === 'blue') log({ k: 'peek', p: p.id, tree: node.tree });
      if (node.type === 'key') { s.t.step = 'guess'; s.t.rem = []; log({ k: 'castle', p: p.id }); }
    };
    const setupGame = () => {
      s.players = s.players.filter(p => !p.left).map(p => ({ id: p.id, name: p.name, color: p.color, pos: BOARD.STAR, cards: [], left: false }));
      s.settings.target = Math.min(s.settings.target, ENG.maxTarget(s.players.length));
      s.layout = shuffle(TREASURES.map(t => t.id));
      s.deck = shuffle(TREASURES.map(t => t.id));
      s.gid = rid(8); s.winner = null; s.log = []; s.ld = null;
      const f = s.players.findIndex(p => p.id === s.settings.first);
      s.turn = f >= 0 ? f : rint(s.players.length);
      s.phase = 'play'; startTurn();
      log({ k: 'start', p: ENG.cur(s).id, wish: s.deck[0] });
    };
    const finishIfAlone = () => {
      const act = ENG.active(s);
      if (s.phase === 'play' && act.length < 2) {
        s.phase = 'over'; s.winner = act[0] ? act[0].id : null; s.t = null;
        log({ k: 'win', p: s.winner, alone: true }); return true;
      }
      return false;
    };

    /* ---------- lobby ---------- */
    if (s.phase === 'lobby') {
      switch (a.a) {
        case 'join': {
          if (!isHost) fail('host only');
          const used = s.players.filter(p => p.id !== a.pid).map(p => p.color);
          const color = (a.color != null && !used.includes(a.color)) ? a.color : [0, 1, 2, 3, 4, 5].find(c => !used.includes(c));
          const name = String(a.name || 'Player').slice(0, 16);
          const ex = ENG.player(s, a.pid);
          if (ex) { ex.name = name; ex.color = color; }
          else { if (s.players.length >= 6) fail('full'); s.players.push({ id: a.pid, name, color }); }
          return s;
        }
        case 'leave': case 'kick': {
          const pid = a.a === 'leave' ? by : a.pid;
          if (a.a === 'kick' && !isHost) fail('host only');
          if (a.a === 'leave' && !isHost && by !== pid) fail('no');
          s.players = s.players.filter(p => p.id !== pid);
          if (s.host === pid && s.players[0]) s.host = s.players[0].id;
          if (s.settings.first === pid) s.settings.first = 'random';
          return s;
        }
        case 'settings': {
          if (!isHost) fail('host only');
          const st = a.settings || {};
          if ([2, 3, 4].includes(st.target)) s.settings.target = st.target;
          if ([0, 1, 2].includes(st.helper)) s.settings.helper = st.helper;
          if (st.first === 'random' || ENG.player(s, st.first)) s.settings.first = st.first;
          return s;
        }
        case 'start': {
          if (!isHost) fail('host only');
          if (s.players.length < (s.room === 'LOCAL' ? 1 : 2)) fail('need 2');
          setupGame(); return s;
        }
      }
      fail('bad lobby action');
    }

    /* ---------- finished ---------- */
    if (s.phase === 'over') {
      if (a.a === 'again') { if (!ENG.player(s, by)) fail('not a player'); setupGame(); return s; }
      if (a.a === 'leave') { const p = ENG.player(s, by); if (p) p.left = true; return s; }
      fail('game over');
    }

    /* ---------- play ---------- */
    const p = ENG.cur(s), t = s.t;
    switch (a.a) {
      case 'leave': case 'kick': {
        const pid = a.a === 'leave' ? by : a.pid;
        if (a.a === 'kick' && !isHost) fail('host only');
        const q = ENG.player(s, pid); if (!q || q.left) fail('no such player');
        q.left = true; log({ k: 'left', p: pid });
        if (s.host === pid) { const h = ENG.active(s)[0]; if (h) s.host = h.id; }
        if (finishIfAlone()) return s;
        if (p.id === pid) nextTurn();
        return s;
      }
      case 'skip': {
        if (by === p.id || !ENG.player(s, by)) fail('cannot skip');
        log({ k: 'skip', p: p.id, by }); nextTurn(); return s;
      }
    }
    if (by !== p.id) fail('not your turn');
    switch (a.a) {
      case 'roll': {
        if (t.step !== 'start') fail('cannot roll now');
        let d = [rint(6) + 1, rint(6) + 1];
        if (TEST && Array.isArray(a.force)) d = a.force.slice(0, 2);
        t.dice = d; s.ld = d; t.rem = [0, 1]; t.dbl = d[0] === d[1];
        log({ k: 'roll', p: p.id, d });
        if (t.dbl) t.step = 'rolled'; else { t.step = 'move'; endIfStuck(); }
        return s;
      }
      case 'normal': {
        if (t.step !== 'rolled') fail('no doubles');
        t.step = 'move'; endIfStuck(); return s;
      }
      case 'move': {
        if (t.step !== 'move' || !t.rem.includes(a.die)) fail('cannot move');
        const r = reachable(p.pos, t.dice[a.die]);
        if (!r.has(a.to)) fail('not reachable');
        t.rem = t.rem.filter(i => i !== a.die);
        land(p, a.to, r.get(a.to), 'die');
        if (t.step === 'guess') return s;
        if (t.rem.length === 0) nextTurn(); else endIfStuck();
        return s;
      }
      case 'magic': {
        if (t.step !== 'rolled') fail('no magic now');
        if (a.k === 'fly') {
          const node = BOARD.nodes[a.to];
          if (!node || node.type !== 'blue' || a.to === p.pos || ENG.occupant(s, a.to, p.id)) fail('bad fly');
          log({ k: 'magic', p: p.id, m: 'fly' });
          land(p, a.to, [p.pos, a.to], 'fly'); nextTurn(); return s;
        }
        if (a.k === 'castle') {
          if (p.pos === BOARD.KEY) fail('already there');
          const past = BOARD.nodes[p.pos].zone === 'castle';
          log({ k: 'magic', p: p.id, m: 'castle' });
          land(p, past ? BOARD.KEY : BOARD.HORSE, [p.pos, past ? BOARD.KEY : BOARD.HORSE], 'fly');
          if (s.t.step !== 'guess') nextTurn();
          return s;
        }
        if (a.k === 'wish') {
          const before = s.deck[0];
          s.deck = shuffle(s.deck);
          log({ k: 'magic', p: p.id, m: 'wish', same: s.deck[0] === before, wish: s.deck[0] });
          nextTurn(); return s;
        }
        fail('unknown magic');
      }
      case 'answer': {
        if (t.step !== 'start' || p.pos !== BOARD.KEY) fail('not at the castle');
        t.step = 'guess'; log({ k: 'castle', p: p.id, stay: true }); return s;
      }
      case 'guess': {
        if (t.step !== 'guess') fail('not guessing');
        const tree = a.tree | 0; if (tree < 0 || tree > 12) fail('bad tree');
        const want = s.deck[0], ok = s.layout[tree] === want;
        log({ k: 'guess', p: p.id, tree, ok, want });
        if (ok) {
          p.cards.push(s.deck.shift());
          if (p.cards.length >= s.settings.target) { s.phase = 'over'; s.winner = p.id; s.t = null; log({ k: 'win', p: p.id }); return s; }
          if (!s.deck.length) {
            const best = ENG.active(s).reduce((b, q) => (q.cards.length > b.cards.length ? q : b));
            s.phase = 'over'; s.winner = best.id; s.t = null; log({ k: 'win', p: best.id, empty: true }); return s;
          }
          log({ k: 'wishnew', wish: s.deck[0] });
        } else {
          p.pos = BOARD.STAR;
        }
        nextTurn(); return s;
      }
    }
    fail('unknown action');
  },
};

<script>
/* ============================================================
   NET — account-free online play. A tiny MQTT 3.1.1 client over
   secure WebSockets talks to public brokers; every phone keeps the
   full game state, and whoever's turn it is publishes the next one.
   ============================================================ */
const DEFAULT_BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const TE = new TextEncoder(), TD = new TextDecoder();
function mqStr(s) { const b = TE.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
function mqPkt(type, body) {
  const lb = []; let x = body.length;
  do { let d = x % 128; x = Math.floor(x / 128); if (x > 0) d |= 128; lb.push(d); } while (x > 0);
  const out = new Uint8Array(1 + lb.length + body.length);
  out[0] = type; out.set(lb, 1); out.set(body, 1 + lb.length); return out;
}

class MiniMQTT {
  constructor(url, { clientId, keepalive = 20, will }) {
    Object.assign(this, { url, clientId, keepalive, will });
    this.subs = new Map(); this.h = {}; this.nid = 1; this.inflight = new Map(); this.queue = [];
    this.state = 'idle'; this.tries = 0; this.closed = false; this.buf = new Uint8Array(0);
  }
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); }
  emit(ev, ...a) { (this.h[ev] || []).forEach(f => { try { f(...a); } catch (e) { console.error(e); } }); }
  connect() {
    if (this.closed) return;
    clearTimeout(this.rt); this.state = 'connecting'; this.buf = new Uint8Array(0);
    let ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.state = 'down'; return this.retry(); }
    ws.binaryType = 'arraybuffer'; this.ws = ws;
    const guard = setTimeout(() => { if (this.state !== 'open') try { ws.close(); } catch (e) {} }, 9000);
    ws.onopen = () => this.send(this.connectPkt());
    ws.onmessage = (e) => this.data(new Uint8Array(e.data));
    ws.onclose = () => { clearTimeout(guard); if (this.ws === ws) this.down(); };
    ws.onerror = () => {};
  }
  down() {
    const was = this.state; this.state = 'down'; this.ws = null; clearInterval(this.pingT);
    if (was === 'open') this.emit('down');
    this.retry();
  }
  retry() {
    if (this.closed) return;
    const d = Math.min(8000, 400 * 2 ** Math.min(this.tries++, 5));
    clearTimeout(this.rt); this.rt = setTimeout(() => this.connect(), d);
  }
  kick() {
    if (this.closed || this.state === 'connecting') return;
    if (this.state === 'open') { // phone woke up: make sure the socket is really alive
      const sent = Date.now(); this.send(mqPkt(0xC0, []));
      setTimeout(() => { if (this.state === 'open' && this.pong < sent) { try { this.ws && this.ws.close(); } catch (e) {} } }, 4000);
      return;
    }
    this.tries = 0; this.connect();
  }
  connectPkt() {
    let flags = 0x02;
    const pl = [...mqStr(this.clientId)];
    if (this.will) { flags |= 0x04 | ((this.will.qos || 0) << 3) | (this.will.retain ? 0x20 : 0); pl.push(...mqStr(this.will.topic), ...mqStr(this.will.payload)); }
    return mqPkt(0x10, [...mqStr('MQTT'), 4, flags, this.keepalive >> 8, this.keepalive & 255, ...pl]);
  }
  send(p) { const ws = this.ws; if (ws && ws.readyState === 1) { try { ws.send(p); } catch (e) {} } }
  data(chunk) {
    const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); this.buf = b;
    for (;;) {
      if (this.buf.length < 2) return;
      let mul = 1, len = 0, i = 1, byte;
      do { if (i >= this.buf.length) return; byte = this.buf[i++]; len += (byte & 127) * mul; mul *= 128; } while (byte & 128);
      if (this.buf.length < i + len) return;
      const h = this.buf[0], body = this.buf.slice(i, i + len);
      this.buf = this.buf.slice(i + len);
      this.packet(h, body);
    }
  }
  packet(h, b) {
    const t = h >> 4;
    if (t === 2) {
      if (b[1] === 0) { this.state = 'open'; this.tries = 0; this.opened(); }
      else { this.emit('refused', b[1]); try { this.ws.close(); } catch (e) {} }
    } else if (t === 3) {
      const qos = (h >> 1) & 3, tl = (b[0] << 8) | b[1];
      const topic = TD.decode(b.slice(2, 2 + tl)); let p = 2 + tl;
      if (qos > 0) { const id = (b[p] << 8) | b[p + 1]; p += 2; this.send(mqPkt(0x40, [id >> 8, id & 255])); }
      this.emit('message', topic, TD.decode(b.slice(p)), !!(h & 1));
    } else if (t === 4) { this.inflight.delete((b[0] << 8) | b[1]); }
    else if (t === 13) { this.pong = Date.now(); }
  }
  opened() {
    for (const [f, q] of this.subs) this.subPkt(f, q);
    for (const p of this.inflight.values()) this.send(p);
    const q = this.queue; this.queue = []; q.forEach(p => this.send(p));
    this.pong = Date.now(); clearInterval(this.pingT);
    this.pingT = setInterval(() => {
      if (Date.now() - this.pong > this.keepalive * 1500) { try { this.ws && this.ws.close(); } catch (e) {} return; }
      this.send(mqPkt(0xC0, []));
    }, this.keepalive * 500);
    this.emit('open');
  }
  id() { this.nid = this.nid % 65000 + 1; return this.nid; }
  subscribe(filter, qos = 1) { this.subs.set(filter, qos); if (this.state === 'open') this.subPkt(filter, qos); }
  subPkt(f, q) { const id = this.id(); this.send(mqPkt(0x82, [id >> 8, id & 255, ...mqStr(f), q])); }
  publish(topic, payload, { qos = 1, retain = false } = {}) {
    const body = [...mqStr(topic)]; let id = 0;
    if (qos) { id = this.id(); body.push(id >> 8, id & 255); }
    const pb = TE.encode(payload); for (let i = 0; i < pb.length; i++) body.push(pb[i]);
    const p = mqPkt(0x30 | (qos << 1) | (retain ? 1 : 0), body);
    if (qos) {
      this.inflight.set(id, p);
      if (this.inflight.size > 40) this.inflight.delete(this.inflight.keys().next().value);
      if (this.state === 'open') this.send(p);
    } else if (this.state === 'open') this.send(p); else this.queue.push(p);
  }
  end() { this.closed = true; clearTimeout(this.rt); clearInterval(this.pingT); this.send(mqPkt(0xE0, [])); try { this.ws && this.ws.close(); } catch (e) {} this.ws = null; this.state = 'closed'; }
}

/* One game room spread over several brokers for resilience. */
class NetRoom {
  constructor({ room, device, seat, brokers }) {
    this.room = room; this.device = device; this.seat = seat || '';
    this.base = `wwoods/v1/${room}`;
    this.h = {}; this.pres = {}; // device -> {s: seat, on: Set(brokerIdx)}
    this.clients = brokers.map((url, i) => {
      const c = new MiniMQTT(url, { clientId: 'ww' + rid(16), keepalive: 20, will: { topic: `${this.base}/p/${device}`, payload: '0', retain: true, qos: 1 } });
      c.subscribe(this.base + '/#', 1);
      c.on('open', () => { this.sayHere(c); this.emit('status', this.status()); });
      c.on('down', () => this.emit('status', this.status()));
      c.on('message', (topic, msg) => this.route(i, topic, msg));
      return c;
    });
  }
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); }
  emit(ev, ...a) { (this.h[ev] || []).forEach(f => { try { f(...a); } catch (e) { console.error(e); } }); }
  start() { this.clients.forEach(c => c.connect()); }
  kick() { this.clients.forEach(c => c.kick()); }
  status() { return this.clients.some(c => c.state === 'open') ? 'online' : 'connecting'; }
  route(bi, topic, msg) {
    const rest = topic.slice(this.base.length + 1);
    if (rest === 's') { if (!msg) return; let s; try { s = JSON.parse(msg); } catch (e) { return; } if (s && s.app === 'ww1' && s.room === this.room) this.emit('state', s); }
    else if (rest === 'j') { let m; try { m = JSON.parse(msg); } catch (e) { return; } if (m && m.pid) this.emit('join', m); }
    else if (rest.startsWith('c/')) { if (!msg) return; let list; try { list = JSON.parse(msg); } catch (e) { return; } if (Array.isArray(list)) this.emit('chat', rest.slice(2), list); }
    else if (rest.startsWith('p/')) {
      const dev = rest.slice(2), e = this.pres[dev] || (this.pres[dev] = { s: '', on: new Set() });
      if (msg && msg !== '0') { try { e.s = JSON.parse(msg).s || ''; } catch (er) {} e.on.add(bi); e.t = Date.now(); } else e.on.delete(bi);
      this.emit('presence');
    }
  }
  sayHere(c) { c.publish(`${this.base}/p/${this.device}`, JSON.stringify({ s: this.seat }), { qos: 1, retain: true }); }
  setSeat(seat) { this.seat = seat || ''; this.clients.forEach(c => { if (c.state === 'open') this.sayHere(c); }); }
  onlineSeats() { const o = new Set(); for (const d in this.pres) { const e = this.pres[d]; if (e.on.size && e.s) o.add(e.s); } return o; }
  publishState(s) { const m = JSON.stringify(s); this.clients.forEach(c => c.publish(this.base + '/s', m, { qos: 1, retain: true })); }
  publishChat(list) { const m = JSON.stringify(list); this.clients.forEach(c => c.publish(`${this.base}/c/${this.device}`, m, { qos: 1, retain: true })); }
  sendJoin(m) { const msg = JSON.stringify(m); this.clients.forEach(c => c.publish(this.base + '/j', msg, { qos: 1 })); }
  close() { this.clients.forEach(c => { if (c.state === 'open') c.publish(`${this.base}/p/${this.device}`, '0', { qos: 0, retain: true }); c.end(); }); }
}

/* Can this page reach any broker at all? (A preview frame that blocks sockets cannot.) */
function probeBrokers(urls, cb) {
  let left = urls.length, done = false;
  const fin = (ok) => { if (!done) { done = true; cb(ok); } };
  urls.forEach(u => {
    let ws;
    try { ws = new WebSocket(u, ['mqtt']); } catch (e) { if (--left === 0) fin(false); return; }
    const t = setTimeout(() => { try { ws.close(); } catch (e) {} }, 7000);
    ws.onopen = () => { clearTimeout(t); fin(true); try { ws.close(); } catch (e) {} };
    ws.onerror = ws.onclose = () => { clearTimeout(t); ws.onerror = ws.onclose = null; if (--left === 0) fin(false); };
  });
}

<script>
/* ============================================================
   HORSE & KNIGHT — each player's piece in the 3D forest.
   Built from smooth lofted shapes (no models to download):
   a horse with jointed legs, mane and tail; an armored knight
   with a plumed helm, shield and pennant in the player's colour;
   the player's name embroidered on the horse's cloth.
   Units are metres; the horse faces +x in its own frame.
   ============================================================ */
const COATS = [
  { name: 'bay', coat: '#6b3a1f', points: '#1c1410', mane: '#17110d' },
  { name: 'grey', coat: '#cfcac0', points: '#8a857d', mane: '#e9e6e0' },
  { name: 'black', coat: '#211c1a', points: '#141110', mane: '#0d0b0a' },
  { name: 'chestnut', coat: '#93491f', points: '#7a3a18', mane: '#a5552a' },
  { name: 'palomino', coat: '#d6a656', points: '#b98d47', mane: '#f1e3c2' },
  { name: 'buckskin', coat: '#b88a4f', points: '#1e1712', mane: '#1b1410' },
];

/* Sweep a smooth tube along a spine through control points, with a (depth, width) radius at each.
   Cross-sections are superellipses; the "up" of each ring lies in the spine's plane. */
function loftGeo(T, pts, rads, opt) {
  opt = opt || {};
  const seg = opt.seg || 64, ring = opt.ring || 20, pw = opt.pow || 2.2, side = opt.side || new T.Vector3(0, 0, 1);
  const curve = new T.CatmullRomCurve3(pts.map(p => new T.Vector3(p[0], p[1], p[2] || 0)), false, 'catmullrom', .5);
  const rc = new T.CatmullRomCurve3(rads.map(r => new T.Vector3(r[0], r[1], r[2] || 0)), false, 'catmullrom', .5);
  const pos = [], uv = [], idx = [], up = new T.Vector3(), sd = new T.Vector3(), tan = new T.Vector3();
  const sp = (c, s) => Math.sign(c) * Math.pow(Math.abs(c), 2 / pw);
  let len = 0, prev = null;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, c = curve.getPoint(t), r = rc.getPoint(t);
    if (prev) len += c.distanceTo(prev); prev = c.clone();
    curve.getTangent(t, tan);
    up.crossVectors(side, tan).normalize(); sd.crossVectors(tan, up).normalize();
    for (let k = 0; k <= ring; k++) {
      const a = k / ring * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      const y = sp(sa) * Math.max(.002, r.x), z = sp(ca) * Math.max(.002, r.y) + (r.z || 0) * Math.max(0, -sa);
      pos.push(c.x + up.x * y + sd.x * z, c.y + up.y * y + sd.y * z, c.z + up.z * y + sd.z * z);
      uv.push(k / ring, len);
    }
  }
  for (let i = 0; i < seg; i++) for (let k = 0; k < ring; k++) { const a = i * (ring + 1) + k, b = a + ring + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function riderTextures(T) {
  if (riderTextures.c) return riderTextures.c;
  const coat = canvasTex(T, 256, 256, (g, w, h) => {
    g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 3000; i++) { const v = 200 + Math.floor(Math.random() * 55); g.strokeStyle = `rgba(${v},${v},${v},.35)`; g.lineWidth = 1; const x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 2, y + 9); g.stroke(); }
  });
  coat.wrapS = coat.wrapT = T.RepeatWrapping; coat.repeat.set(3, 2);
  const hair = canvasTex(T, 128, 256, (g, w, h) => {
    for (let i = 0; i < 420; i++) { const x = Math.random() * w, v = 140 + Math.floor(Math.random() * 115); g.strokeStyle = `rgba(${v},${v},${v},${.6 + Math.random() * .4})`; g.lineWidth = .8 + Math.random() * 1.6; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + 6, h * .3, x - 6, h * .6, x + (Math.random() - .5) * 14, h * (.75 + Math.random() * .25)); g.stroke(); }
  });
  hair.wrapS = T.RepeatWrapping;
  riderTextures.c = { coat, hair };
  return riderTextures.c;
}

// cloth over the horse: the player's colour, gold trim, and their name on both sides
function caparisonTex(T, color, name) {
  const W = 1024, H = 512;
  return canvasTex(T, W, H, (g) => {
    const c = new T.Color(color), dark = '#' + c.clone().multiplyScalar(.62).getHexString(), light = '#' + c.clone().lerp(new T.Color('#ffffff'), .18).getHexString();
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, dark); gr.addColorStop(.5, light); gr.addColorStop(1, dark);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // woven texture
    for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},.035)`; g.fillRect(Math.random() * W, Math.random() * H, 2, 1); }
    // gold trim along both hems and the ends
    g.fillStyle = '#e8b53c'; g.fillRect(0, 0, W, 22); g.fillRect(0, H - 22, W, 22); g.fillRect(0, 0, 14, H); g.fillRect(W - 14, 0, 14, H);
    g.fillStyle = '#7a5310'; for (let x = 8; x < W; x += 26) { g.fillRect(x, 8, 12, 6); g.fillRect(x, H - 14, 12, 6); }
    // the name, once for each side panel (each reads the right way round from its side)
    const label = (name || '').toUpperCase().slice(0, 12), fs = Math.min(92, Math.floor(820 / Math.max(4, label.length) * 1.25));
    g.font = `900 ${fs}px "Cinzel Decorative", "Cinzel", Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const write = (y, flip) => {
      g.save(); g.translate(W / 2, y); if (flip) g.scale(-1, -1);
      g.lineWidth = Math.max(6, fs * .12); g.strokeStyle = 'rgba(40,22,4,.85)'; g.strokeText(label, 0, 0);
      const gg = g.createLinearGradient(0, -fs / 2, 0, fs / 2); gg.addColorStop(0, '#fff3c4'); gg.addColorStop(.5, '#f2c650'); gg.addColorStop(1, '#b8801c');
      g.fillStyle = gg; g.fillText(label, 0, 0); g.restore();
    };
    // set toward the back of the cloth, clear of the rider's leg
    const write2 = (y, flip) => { g.save(); g.translate(-W * .17, 0); write(y, flip); g.restore(); };
    write2(H * .2, true); write2(H * .8, false);
  });
}

function nameTex(T, color, name) {
  return canvasTex(T, 512, 160, (g, w, h) => {
    const c = new T.Color(color); g.fillStyle = '#' + c.clone().multiplyScalar(.8).getHexString(); g.fillRect(0, 0, w, h);
    g.fillStyle = '#e8b53c'; g.fillRect(0, 0, w, 10); g.fillRect(0, h - 10, w, 10);
    const label = (name || '').toUpperCase().slice(0, 12), fs = Math.min(96, Math.floor(470 / Math.max(3, label.length) * 1.3));
    g.font = `900 ${fs}px "Cinzel Decorative", "Cinzel", Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 8; g.strokeStyle = 'rgba(40,22,4,.85)'; g.strokeText(label, w / 2, h / 2 + 4);
    g.fillStyle = '#ffe9a8'; g.fillText(label, w / 2, h / 2 + 4);
  });
}
// a heater shield (flat outline, extruded a little) and its painted face
function shieldGeo(T) {
  const s = new T.Shape(); s.moveTo(-.22, .26); s.lineTo(.22, .26); s.lineTo(.22, .02); s.quadraticCurveTo(.2, -.22, 0, -.34); s.quadraticCurveTo(-.2, -.22, -.22, .02); s.closePath();
  const g = new T.ExtrudeGeometry(s, { depth: .03, bevelEnabled: true, bevelThickness: .012, bevelSize: .012, bevelSegments: 2, curveSegments: 10 });
  const p = g.attributes.position, uv = g.attributes.uv; for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + .25) / .5, (p.getY(i) + .37) / .66);
  return g;
}
function shieldTex(T, color, letter) {
  return canvasTex(T, 256, 320, (g, w, h) => {
    g.fillStyle = color; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(w, 0); g.lineTo(0, h * .7); g.fill();
    g.strokeStyle = '#e8b53c'; g.lineWidth = 18; g.strokeRect(9, 9, w - 18, h - 18);
    g.fillStyle = '#f6e7b8'; g.font = '900 150px "Cinzel Decorative", Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 10; g.strokeStyle = 'rgba(40,22,4,.8)'; g.strokeText(letter, w / 2, h * .42); g.fillText(letter, w / 2, h * .42);
  });
}

function buildRider(T, color, coatIdx, name) {
  const tx = riderTextures(T), coat = COATS[coatIdx % COATS.length];
  const coatM = new T.MeshPhysicalMaterial({ color: coat.coat, map: tx.coat, roughness: .55, sheen: .6, sheenRoughness: .5, sheenColor: new T.Color(coat.coat).lerp(new T.Color('#ffffff'), .35), clearcoat: .15, clearcoatRoughness: .5 });
  const pointM = new T.MeshPhysicalMaterial({ color: coat.points, map: tx.coat, roughness: .6, sheen: .4, sheenColor: '#777777' });
  const hoofM = new T.MeshStandardMaterial({ color: '#2a2420', roughness: .45 });
  const hairM = new T.MeshStandardMaterial({ color: coat.mane, map: tx.hair, roughness: .7, side: T.DoubleSide, alphaTest: .35, transparent: false });
  const eyeM = new T.MeshStandardMaterial({ color: '#120c0a', roughness: .08, metalness: .1 });
  const steelM = new T.MeshStandardMaterial({ color: '#c9ced6', metalness: 1, roughness: .26 });
  const darkSteelM = new T.MeshStandardMaterial({ color: '#545a63', metalness: 1, roughness: .4 });
  const goldM = new T.MeshStandardMaterial({ color: '#e2b04a', metalness: 1, roughness: .28 });
  const leatherM = new T.MeshStandardMaterial({ color: '#4a2e1c', roughness: .7 });
  const clothM = new T.MeshStandardMaterial({ color, roughness: .82, side: T.DoubleSide });
  const capM = new T.MeshStandardMaterial({ map: caparisonTex(T, color, name), roughness: .85, side: T.DoubleSide });
  const woodM = new T.MeshStandardMaterial({ color: '#6b4a2c', roughness: .7 });

  const grp = new T.Group(), body = new T.Group(); grp.add(body); // body bobs and pitches with the gait
  const mesh = (g, m, parent) => { const x = new T.Mesh(g, m); x.castShadow = true; (parent || body).add(x); return x; };

  // ---- the horse's body, neck and head as one smooth sweep ----
  // tail-head, croup, back, barrel, chest, a deep neck, the jowl, then the face tapering to a soft muzzle
  const spine = [[-1.14, 1.3], [-1.08, 1.31], [-.9, 1.29], [-.6, 1.24], [-.25, 1.19], [.1, 1.18], [.42, 1.21], [.66, 1.31], [.84, 1.5], [.96, 1.72], [1.05, 1.9], [1.12, 2.02], [1.24, 2.0], [1.36, 1.86], [1.47, 1.72], [1.55, 1.62], [1.59, 1.57], [1.6, 1.56]];
  const radii = [[.02, .02], [.22, .2], [.36, .31], [.42, .35], [.43, .36], [.45, .37], [.44, .33], [.4, .28], [.34, .23], [.28, .19], [.22, .15], [.19, .13], [.2, .135], [.15, .115], [.125, .1], [.11, .095], [.07, .07], [.01, .01]];
  mesh(loftGeo(T, spine, radii, { seg: 96, ring: 28, pow: 2.15 }), coatM);
  // ears, eyes, nostrils
  [-1, 1].forEach(s => {
    const ear = mesh(new T.ConeGeometry(.045, .17, 12), coatM); ear.position.set(1.13, 2.2, s * .075); ear.rotation.set(s * -.28, 0, -.2); ear.scale.set(1, 1, .6);
    const eye = mesh(new T.SphereGeometry(.03, 14, 10), eyeM); eye.position.set(1.26, 2.02, s * .125);
    const nos = mesh(new T.SphereGeometry(.024, 10, 8), hoofM); nos.position.set(1.585, 1.6, s * .05);
  });
  // mane along the crest, forelock, and the tail (hair cards with strands)
  { const crest = [[1.12, 2.13, .0], [1.05, 2.02, .02], [.95, 1.84, .03], [.84, 1.66, .04], [.72, 1.5, .04]];
    const pos = [], uv = [], idx = [];
    crest.forEach(([x, y, z], i) => { const u = i / (crest.length - 1); pos.push(x, y + .05, z, x - .03, y - .2 - u * .06, z + .12); uv.push(u * 2, 0, u * 2, 1); });
    for (let i = 0; i < crest.length - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
    mesh(g, hairM);
    const fl = mesh(new T.PlaneGeometry(.12, .2), hairM); fl.position.set(1.19, 2.1, 0); fl.rotation.set(0, Math.PI / 2, -.5);
  }
  const tail = new T.Group(); tail.position.set(-1.12, 1.3, 0); body.add(tail);
  mesh(loftGeo(T, [[0, 0], [-.14, -.12], [-.22, -.45], [-.2, -.8], [-.12, -1.02]], [[.05, .05], [.09, .08], [.12, .1], [.09, .08], [.01, .02]], { seg: 24, ring: 12 }), hairM, tail);

  // ---- legs: upper part swings at the shoulder or hip; lower part bends at the knee or hock ----
  const legs = [];
  const leg = (x, z, front) => {
    const hip = new T.Group(); hip.position.set(x, 1.02, z); body.add(hip);
    const kneeY = front ? -.5 : -.48, kneeX = front ? .02 : -.13;
    mesh(loftGeo(T, [[0, .16], [0, 0], [kneeX * .6, -.25], [kneeX, kneeY]], front ? [[.15, .12], [.12, .1], [.085, .075], [.07, .065]] : [[.2, .13], [.16, .11], [.1, .08], [.07, .06]], { seg: 16, ring: 14, side: new T.Vector3(0, 0, 1) }), coatM, hip);
    const knee = new T.Group(); knee.position.set(kneeX, kneeY, 0); hip.add(knee);
    const footY = -(1.02 + kneeY);
    mesh(loftGeo(T, [[0, .02], [0, -.2], [.0, footY + .19], [.03, footY + .1], [.05, footY + .05]], [[.07, .065], [.05, .045], [.06, .055], [.05, .045], [.055, .05]], { seg: 18, ring: 12 }), pointM, knee);
    const hoof = mesh(new T.CylinderGeometry(.055, .075, .09, 16), hoofM, knee); hoof.position.set(.055, footY + .045, 0);
    legs.push({ hip, knee, front, side: Math.sign(z) });
  };
  leg(.6, .2, true); leg(.6, -.2, true); leg(-.72, .21, false); leg(-.72, -.21, false);

  // ---- saddle cloth with the name, saddle, reins ----
  { // drape: over the back from ribs to hip, hanging to the knees, with a gently waved hem
    const cols = 26, rows = 22, pos = [], uv = [], idx = [], spineC = new T.CatmullRomCurve3(spine.map(p => new T.Vector3(p[0], p[1], 0)), false, 'catmullrom', .5), radC = new T.CatmullRomCurve3(radii.map(r => new T.Vector3(r[0], r[1], 0)), false, 'catmullrom', .5);
    const t0 = 2.6 / 16, t1 = 7.2 / 16;

        let y = c.y + Math.sin(a) * (r.x + .035), z = Math.cos(a) * (r.y + .045);
